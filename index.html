<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraVault | Luxury Archive</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --black: #0a0a0a;
            --dark-grey: #1a1a1a;
            --light-grey: #f4f4f4;
            --green: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--black);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Fixed Header - Removed Sticky to prevent covering products */
        header {
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid #222;
            background: var(--black);
            position: relative; /* Changed from sticky */
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--gold);
            letter-spacing: 6px;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
        }

        .nav-link {
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .nav-link.active, .nav-link:hover {
            color: var(--gold);
        }

        /* Grid & Cards */
        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: #0f0f0f;
            border: 1px solid #1a1a1a;
            padding: 15px;
            text-align: center;
            transition: 0.4s;
        }

        .card:hover {
            border-color: #333;
            transform: translateY(-5px);
        }

        /* Image Optimization - Removed Whitespace */
        .img-container {
            width: 100%;
            aspect-ratio: 4/5;
            overflow: hidden;
            background: #000;
            margin-bottom: 20px;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* This fills the space without gaps */
        }

        .dual-preview {
            display: flex;
            gap: 10px;
            aspect-ratio: 4/5;
            margin-bottom: 20px;
        }

        .dual-preview div {
            flex: 1;
            overflow: hidden;
        }

        .dual-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            margin: 15px 0 5px;
            letter-spacing: 1px;
        }

        .price-tag {
            color: var(--gold);
            font-size: 1rem;
            margin-bottom: 15px;
        }

        /* Buttons & Tags */
        .action-btn {
            background: transparent;
            border: 1px solid #333;
            color: #fff;
            padding: 15px;
            cursor: pointer;
            width: 100%;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .action-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .delivery-tag {
            font-size: 0.65rem;
            color: #555;
            display: block;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* Modal & Admin remains same as original for functionality */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal {
            position: relative;
            margin: 40px auto;
            background: #0a0a0a;
            padding: 30px;
            border: 1px solid #222;
            width: 90%;
            max-width: 900px;
        }

        .thumb-box { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .thumb-box img { width: 50px; height: 60px; object-fit: cover; border: 1px solid #222; cursor: pointer; opacity: 0.5; }
        .thumb-box img:hover { opacity: 1; border-color: var(--gold); }

        .checkout-form input, .checkout-form select, .checkout-form textarea {
            width: 100%; padding: 15px; background: #000; border: 1px solid #222; color: white; margin-bottom: 10px;
        }

        .admin-section { background: #111; padding: 20px; margin-top: 20px; display: none; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .json-output { background: #000; padding: 15px; color: var(--green); font-size: 0.8rem; white-space: pre; overflow-x: auto; margin-top: 10px; }

        @media (max-width: 768px) {
            .logo { font-size: 1.8rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="openAdmin()">AURAVAULT</div>
    <nav>
        <span class="nav-link active" onclick="switchTab('summaries.json', this)">SUMMARIES</span>
        <span class="nav-link" onclick="switchTab('books.json', this)">BOOKS</span>
        <span class="nav-link" onclick="switchTab('hoody.json', this)">HOODIES</span>
    </nav>
</header>

<div class="container">
    <div id="product-grid" class="grid"></div>

    <div id="admin-panel" style="display:none; margin-top: 50px; border-top: 1px solid var(--gold); padding-top: 30px;">
        <h2 style="color:var(--gold); text-align:center; letter-spacing: 4px; margin-bottom: 20px;">VAULT ARCHITECT</h2>
        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
            <button class="action-btn" style="width:auto" onclick="toggleAdminForm('summary')">SUMMARY</button>
            <button class="action-btn" style="width:auto" onclick="toggleAdminForm('book')">BOOK</button>
            <button class="action-btn" style="width:auto" onclick="toggleAdminForm('hoodie')">HOODIE</button>
        </div>

        <div id="form-summary" class="admin-section">
            <input type="text" id="as-title" placeholder="Title">
            <textarea id="as-narrative" placeholder="Narrative" style="width:100%; background:#000; color:#fff; border:1px solid #222; padding:10px; height:80px; margin-bottom:10px;"></textarea>
            <div class="admin-grid"><input type="text" id="as-book-img" placeholder="Book Image"><input type="text" id="as-book-price" placeholder="Book Price"></div>
            <div class="admin-grid"><input type="text" id="as-h-front" placeholder="H-Front"><input type="text" id="as-h-back" placeholder="H-Back"><input type="text" id="as-h-sleeve" placeholder="H-Left Sleeve"><input type="text" id="as-fabric" placeholder="Fabric"></div>
            <div class="admin-grid"><input type="text" id="as-p-sl" placeholder="Price S-L"><input type="text" id="as-p-xl" placeholder="Price XL"><input type="text" id="as-p-2xl" placeholder="Price 2XL"><input type="text" id="as-p-3xl" placeholder="Price 3XL"></div>
            <button class="action-btn" onclick="generateJSON('summary')">GENERATE SUMMARY</button>
        </div>

        <div id="form-book" class="admin-section">
            <input type="text" id="ab-title" placeholder="Book Title"><input type="text" id="ab-price" placeholder="Price"><input type="text" id="ab-img" placeholder="Image URL"><input type="text" id="ab-del" placeholder="Delivery Time"><button class="action-btn" onclick="generateJSON('book')">GENERATE BOOK</button>
        </div>

        <div id="form-hoodie" class="admin-section">
            <input type="text" id="ah-title" placeholder="Hoodie Title"><input type="text" id="ah-front" placeholder="Front URL"><input type="text" id="ah-back" placeholder="Back URL"><input type="text" id="ah-sleeve" placeholder="Sleeve URL"><input type="text" id="ah-fabric" placeholder="Fabric"><input type="text" id="ah-colors" placeholder="Colors"><div class="admin-grid"><input type="text" id="ah-p-sl" placeholder="Price S-L"><input type="text" id="ah-p-xl" placeholder="Price XL"><input type="text" id="ah-p-2xl" placeholder="Price 2XL"><input type="text" id="ah-p-3xl" placeholder="Price 3XL"></div><button class="action-btn" onclick="generateJSON('hoodie')">GENERATE HOODIE</button>
        </div>
        <div id="json-output" class="json-output">JSON Code will appear here...</div>
    </div>
</div>

<div id="main-modal" class="overlay">
    <div class="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 id="modal-title" style="font-family:'Playfair Display'; color:var(--gold); text-align:center; margin-bottom:20px; font-size:1.8rem;"></h2>
        <div id="modal-content"></div>
    </div>
</div>

<script>
    (function(){ emailjs.init("QWKaC8MCGOF9GwKvN"); })();
    let activeFile = 'summaries.json';
    let currentPrices = {};

    async function switchTab(file, element) {
        activeFile = file;
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
        element.classList.add('active');
        loadProducts();
    }

    async function loadProducts() {
        const grid = document.getElementById('product-grid');
        try {
            const response = await fetch(activeFile);
            const products = await response.json();
            grid.innerHTML = '';
            products.forEach(item => {
                let media = item.summaryText ? `<div class="dual-preview"><div><img src="${item.bookImg}"></div><div><img src="${item.imageUrl}"></div></div>` : `<div class="img-container"><img src="${item.imageUrl || item.bookImg}" onmouseover="if('${item.backImageUrl}') this.src='${item.backImageUrl}'" onmouseout="this.src='${item.imageUrl || item.bookImg}'"></div>`;
                grid.innerHTML += `<div class="card">${media}<h3>${item.title}</h3><div class="price-tag">$${item.price || item.bookPrice}</div>${item.delivery ? `<span class="delivery-tag">📦 ${item.delivery}</span>` : ''}<button class="action-btn" onclick='openPreview(${JSON.stringify(item)})'>${item.summaryText ? 'EXPLORE ARCHIVE' : 'ORDER NOW'}</button></div>`;
            });
        } catch (e) { grid.innerHTML = `<p style="text-align:center; color:#333; width:100%;">VAULT EMPTY</p>`; }
    }

    function openPreview(item) {
        const modal = document.getElementById('main-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = item.title;
        modal.style.display = 'block';

        if (item.summaryText) {
            content.innerHTML = `
                <div style="display:flex; gap:20px; flex-wrap:wrap;">
                    <div style="flex:1; min-width:250px; background:#0a0a0a; padding:15px; border:1px solid #111;">
                        <img src="${item.bookImg}" style="width:100%; object-fit:cover; margin-bottom:15px; border:1px solid #222;">
                        <button class="action-btn" onclick="startOrder('${item.title} (Book)', '${item.bookPrice}', false, '', null, '')">BUY BOOK ($${item.bookPrice})</button>
                    </div>
                    <div style="flex:1; min-width:250px; background:#0a0a0a; padding:15px; border:1px solid #111;">
                        <img id="h-view" src="${item.imageUrl}" style="width:100%; object-fit:cover; margin-bottom:15px; border:1px solid #222;">
                        <div class="thumb-box">
                            <img src="${item.imageUrl}" onclick="document.getElementById('h-view').src='${item.imageUrl}'">
                            <img src="${item.backImageUrl}" onclick="document.getElementById('h-view').src='${item.backImageUrl}'">
                            ${item.sleeveImg ? `<img src="${item.sleeveImg}" onclick="document.getElementById('h-view').src='${item.sleeveImg}'">` : ''}
                        </div>
                        <button class="action-btn" onclick='startOrder("${item.title} (Hoodie)", "${item.price}", true, "${item.colors || 'Black'}", ${JSON.stringify(item.prices)}, "${item.fabric || 'Cotton'}", "${item.imageUrl}", "${item.backImageUrl}", "${item.sleeveImg}")'>BUY HOODIE ($${item.price})</button>
                    </div>
                </div>
                <p style="color:#666; font-size:0.9rem; line-height:1.6; font-style:italic; margin-top:20px; text-align:center;">"${item.summaryText}"</p>`;
        } else {
            startOrder(item.title, item.price || item.bookPrice, activeFile === 'hoody.json', item.colors, item.prices, item.fabric, item.imageUrl, item.backImageUrl, item.sleeveImg);
        }
    }

    function startOrder(title, price, isH, colors, prices, fabric, imgF, imgB, imgS) {
        window.tempPrice = price;
        currentPrices = prices || { "S": price, "M": price, "L": price, "XL": price, "2XL": price, "3XL": price };
        const content = document.getElementById('modal-content');
        let visual = isH ? `<div style="text-align:center; margin-bottom:15px;"><img id="chk-view" src="${imgF}" style="max-height:180px; object-fit:cover; border:1px solid #222; margin-bottom:10px;"><div class="thumb-box" style="margin-top:0"><img src="${imgF}" onclick="document.getElementById('chk-view').src='${imgF}'" style="width:30px;height:40px;"><img src="${imgB}" onclick="document.getElementById('chk-view').src='${imgB}'" style="width:30px;height:40px;">${imgS?`<img src="${imgS}" onclick="document.getElementById('chk-view').src='${imgS}'" style="width:30px;height:40px;">`:''}</div></div>` : '';
        let opts = isH ? `<div class="admin-grid"><select id="size" onchange="updateModalPrice(this)" required><option value="">SIZE</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="2XL">2XL</option><option value="3XL">3XL</option></select><select id="color" required><option value="">COLOR</option>${(colors||"Black").split(',').map(c=>`<option>${c.trim()}</option>`).join('')}</select></div>` : '';
        content.innerHTML = `${visual}<div class="checkout-form"><h3 id="p-display" style="text-align:center; color:var(--gold); font-size:1.5rem; margin-bottom:15px;">$${price}</h3><input id="name" placeholder="Full Name"><input id="phone" placeholder="Phone Number"><input id="email" placeholder="Email">${opts}<input id="country" placeholder="Country"><div class="admin-grid"><input id="city" placeholder="City"><input id="zip" placeholder="ZIP"></div><textarea id="address" placeholder="Shipping Address" rows="2"></textarea><button class="action-btn" id="confirm-btn" onclick="sendVaultOrder('${title}')" style="background:var(--gold); color:black; border:none;">COMPLETE RESERVATION</button></div>`;
    }

    function updateModalPrice(s) { if(s.value) { const np = currentPrices[s.value]; document.getElementById('p-display').innerText = "$" + np; window.tempPrice = np; } }

    function sendVaultOrder(t) {
        const btn = document.getElementById('confirm-btn');
        const data = { customer_name: document.getElementById('name').value, customer_phone: document.getElementById('phone').value, customer_email: document.getElementById('email').value, customer_country: document.getElementById('country').value, customer_city: document.getElementById('city').value, customer_zip: document.getElementById('zip').value, customer_address: document.getElementById('address').value, item_title: t, item_price: window.tempPrice, item_size: document.getElementById('size')?.value || 'N/A', item_color: document.getElementById('color')?.value || 'N/A' };
        if(!data.customer_name || !data.customer_phone || !data.customer_address) return alert("Archive requires more details.");
        btn.innerText = "SENDING..."; btn.disabled = true;
        emailjs.send("service_9yrz8kd", "template_1lgifb3", data).then(() => { alert("Order archived!"); closeModal(); }, () => { alert("Error!"); btn.disabled = false; });
    }

    function openAdmin() { if(prompt("Key:") === "canon_-!LB2107") document.getElementById('admin-panel').style.display='block'; }
    function toggleAdminForm(t) { document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none'); document.getElementById('form-' + t).style.display = 'block'; }
    function generateJSON(type) {
        let entry = {};
        if(type === 'summary') {
            const sp = document.getElementById('as-p-sl').value;
            entry = { title: document.getElementById('as-title').value, summaryText: document.getElementById('as-narrative').value, bookImg: document.getElementById('as-book-img').value, bookPrice: document.getElementById('as-book-price').value, imageUrl: document.getElementById('as-h-front').value, backImageUrl: document.getElementById('as-h-back').value, sleeveImg: document.getElementById('as-h-sleeve').value, fabric: document.getElementById('as-fabric').value, price: sp, prices: { "S": sp, "M": sp, "L": sp, "XL": document.getElementById('as-p-xl').value, "2XL": document.getElementById('as-p-2xl').value, "3XL": document.getElementById('as-p-3xl').value } };
        } else if(type === 'book') {
            entry = { title: document.getElementById('ab-title').value, bookPrice: document.getElementById('ab-price').value, bookImg: document.getElementById('ab-img').value, delivery: document.getElementById('ab-del').value };
        } else if(type === 'hoodie') {
            const hp = document.getElementById('ah-p-sl').value;
            entry = { title: document.getElementById('ah-title').value, price: hp, imageUrl: document.getElementById('ah-front').value, backImageUrl: document.getElementById('ah-back').value, sleeveImg: document.getElementById('ah-sleeve').value, fabric: document.getElementById('ah-fabric').value, colors: document.getElementById('ah-colors').value, prices: { "S": hp, "M": hp, "L": hp, "XL": document.getElementById('ah-p-xl').value, "2XL": document.getElementById('ah-p-2xl').value, "3XL": document.getElementById('ah-p-3xl').value } };
        }
        document.getElementById('json-output').innerText = JSON.stringify(entry, null, 4) + ",";
    }
    function closeModal() { document.getElementById('main-modal').style.display = 'none'; }
    window.onload = loadProducts;
</script>
</body>
</html>
