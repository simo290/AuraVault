<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AuraVault - The most exclusive private archive in the world.">
    <title>AURAVAULT | Private Archive & Secure Logistics</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@100;200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* AURAVAULT MASTER STYLESHEET
           ---------------------------
           Architecture: BEM-inspired 
           Color Palette: Onyx, Gold, Bone
        */

        :root {
            /* Branding Colors */
            --gold: #d4af37;
            --gold-light: #f1d592;
            --gold-dark: #aa8c2c;
            --gold-glow: rgba(212, 175, 55, 0.12);
            
            /* Neutral Palette */
            --black: #050505;
            --deep-black: #000000;
            --rich-black: #0a0a0b;
            --onyx: #121212;
            --bone: #f5f5f7;
            
            /* Border & Interface */
            --border-dim: #151515;
            --border-medium: #252525;
            --border-bright: #444444;
            
            /* Status Colors */
            --error-red: #ff3b3b;
            --success-green: #00ff88;
            --info-blue: #3498db;
            
            /* Typography & Animation */
            --font-main: 'Inter', sans-serif;
            --font-display: 'Playfair Display', serif;
            --font-serif: 'Cormorant Garamond', serif;
            --transition-ultra: 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-fast: 0.4s ease;
        }

        /* RESET & BASE */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            outline: none; 
            cursor: none !important; /* Forces custom luxury cursor */
        }

        body { 
            background-color: var(--black); 
            color: #ffffff; 
            font-family: var(--font-main); 
            line-height: 1.7; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* SCROLLBAR CUSTOMIZATION */
        ::-webkit-scrollbar { width: 2px; }
        ::-webkit-scrollbar-track { background: var(--deep-black); }
        ::-webkit-scrollbar-thumb { background: var(--gold); }

        /* --- LUXURY OVERLAYS --- */
        #cursor-dot {
            pointer-events: none;
            position: fixed;
            top: 0; left: 0;
            width: 6px;
            height: 6px;
            background: var(--gold);
            border-radius: 50%;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #cursor-outline {
            pointer-events: none;
            position: fixed;
            top: 0; left: 0;
            width: 40px;
            height: 40px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.15s ease-out;
        }

        #loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--deep-black);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10001;
            transition: 1.8s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .loader-logo {
            font-family: var(--font-display);
            font-size: 2.2rem;
            letter-spacing: 20px;
            color: var(--gold);
            margin-bottom: 25px;
            animation: loaderPulse 3s infinite;
        }

        .loader-bar-bg {
            width: 250px;
            height: 1px;
            background: #111;
            position: relative;
        }

        .loader-bar-fill {
            position: absolute;
            top: 0; left: 0;
            width: 0;
            height: 100%;
            background: var(--gold);
            transition: 2s ease;
        }

        @keyframes loaderPulse {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); text-shadow: 0 0 30px var(--gold-glow); }
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            padding: 90px 40px 40px;
            text-align: center;
            position: relative;
            z-index: 100;
        }

        .brand-logo {
            font-family: var(--font-display);
            font-size: 3.8rem;
            color: var(--gold);
            letter-spacing: 15px;
            text-transform: uppercase;
            transition: var(--transition-ultra);
            display: inline-block;
            cursor: pointer;
        }

        .brand-logo:hover {
            letter-spacing: 22px;
            transform: scale(1.03);
            opacity: 0.8;
        }

        .nav-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 50px;
        }

        .nav-link {
            color: #555;
            text-decoration: none;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 5px;
            transition: 0.8s;
            text-transform: uppercase;
            padding: 12px 0;
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 1px;
            background: var(--gold);
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-link.active, .nav-link:hover {
            color: #ffffff;
        }

        .nav-link.active::after {
            width: 100%;
        }

        /* --- GRID SYSTEM --- */
        .main-content {
            max-width: 1500px;
            margin: 0 auto;
            padding: 0 60px 150px;
        }

        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 120px 60px;
            opacity: 0;
            transform: translateY(40px);
            transition: 2.5s var(--transition-ultra);
        }

        .archive-grid.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .archive-card {
            background: transparent;
            border: 1px solid var(--border-dim);
            padding: 30px;
            border-radius: 4px;
            transition: var(--transition-ultra);
            position: relative;
            overflow: hidden;
        }

        .archive-card:hover {
            border-color: var(--border-medium);
            background: var(--rich-black);
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
        }

        .archive-img-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            background: #000;
            margin-bottom: 30px;
            border-radius: 2px;
            position: relative;
        }

        .archive-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 3s var(--transition-ultra);
            filter: grayscale(20%);
        }

        .archive-card:hover img {
            transform: scale(1.1);
            filter: grayscale(0%);
        }

        .archive-card-info {
            text-align: center;
        }

        .archive-card-info h3 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            letter-spacing: 2px;
            font-weight: 400;
            margin-bottom: 12px;
            color: #eee;
        }

        .archive-price {
            color: var(--gold);
            font-size: 1.1rem;
            letter-spacing: 3px;
            font-weight: 200;
            font-family: var(--font-main);
        }

        .action-button {
            background: transparent;
            border: 1px solid #1a1a1a;
            color: #fff;
            padding: 22px;
            width: 100%;
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 30px;
            transition: 0.5s;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .action-button:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* --- MODAL SYSTEM --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 9999;
            overflow-y: auto;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .modal-body {
            position: relative;
            margin: 5vh auto;
            background: var(--deep-black);
            padding: 100px 80px;
            border: 1px solid var(--border-dim);
            width: 90%;
            max-width: 1200px;
            border-radius: 4px;
            animation: modalFadeIn 1.2s var(--transition-ultra);
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(60px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 40px; right: 40px;
            color: #333;
            font-size: 2.2rem;
            transition: 0.4s;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--gold);
            transform: rotate(90deg);
        }

        /* --- CHECKOUT FORM --- */
        .checkout-container {
            max-width: 750px;
            margin: 0 auto;
        }

        .checkout-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .checkout-title h2 {
            font-family: var(--font-display);
            font-size: 2.8rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .checkout-title p {
            letter-spacing: 6px;
            color: #444;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .form-input {
            width: 100%;
            padding: 24px;
            background: transparent;
            border: 1px solid var(--border-dim);
            color: #fff;
            font-family: var(--font-main);
            font-size: 0.9rem;
            transition: 0.5s;
        }

        .form-input:focus {
            border-color: var(--gold);
            background: #080808;
        }

        .form-input.invalid {
            border-color: var(--error-red);
        }

        .submit-order-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 25px;
            width: 100%;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-top: 40px;
            transition: 0.5s;
        }

        .submit-order-btn:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }

        .submit-order-btn:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
        }

        /* --- ADMIN PANEL (RESTRICTED) --- */
        #architect-section {
            display: none;
            padding: 100px 60px;
            background: var(--deep-black);
            border-top: 1px solid var(--border-dim);
            margin-top: 100px;
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
        }

        .terminal-container {
            background: #020202;
            border: 1px solid #111;
            padding: 25px;
            font-family: 'Courier New', monospace;
            height: 450px;
            overflow-y: auto;
            font-size: 0.75rem;
            color: #666;
            line-height: 1.8;
        }

        .admin-title {
            color: var(--gold);
            letter-spacing: 12px;
            font-size: 1.5rem;
            margin-bottom: 50px;
            text-align: center;
        }

        .json-viewer {
            background: #080808;
            padding: 25px;
            color: var(--success-green);
            font-size: 0.8rem;
            white-space: pre-wrap;
            border: 1px solid #111;
            margin-top: 25px;
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-width: 1000px) {
            .archive-grid { grid-template-columns: 1fr 1fr; }
            .modal-body { padding: 60px 40px; }
            .brand-logo { font-size: 2.8rem; letter-spacing: 10px; }
        }

        @media (max-width: 768px) {
            .archive-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .nav-container { gap: 20px; }
            #cursor-dot, #cursor-outline { display: none; }
            * { cursor: auto !important; }
        }
    </style>
</head>
<body>

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>

    <div id="loader">
        <div class="loader-logo">AURAVAULT</div>
        <div class="loader-bar-bg">
            <div class="loader-bar-fill" id="load-bar"></div>
        </div>
    </div>

    <header>
        <div class="brand-logo" id="main-logo">AURAVAULT</div>
        <nav class="nav-container" id="category-nav">
            <a href="javascript:void(0)" class="nav-link active" data-archive="summaries.json">Summaries</a>
            <a href="javascript:void(0)" class="nav-link" data-archive="books.json">Books</a>
            <a href="javascript:void(0)" class="nav-link" data-archive="hoody.json">Hoodies</a>
        </nav>
    </header>

    <main class="main-content">
        <div id="product-display" class="archive-grid"></div>

        <section id="architect-section">
            <h2 class="admin-title">VAULT ARCHITECT CONTROL</h2>
            <div class="admin-layout">
                <div class="admin-tools">
                    <div class="form-group">
                        <select id="adm-entry-type" class="form-input">
                            <option value="summary">Archive Summary Entry</option>
                            <option value="product">Standard Product Entry</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input id="adm-entry-title" placeholder="Entry Official Title" class="form-input">
                    </div>
                    <div class="form-group">
                        <textarea id="adm-entry-desc" placeholder="Narrative text or Product metadata" class="form-input" style="height: 150px;"></textarea>
                    </div>
                    <button class="action-button" onclick="AuraCore.admin.generateData()">SYNTESIZE DATA</button>
                    <button class="action-button" style="border-color: var(--gold); color: var(--gold);" onclick="AuraCore.admin.exportAuditTrail()">DOWNLOAD AUDIT LOGS (.TXT)</button>
                </div>
                <div class="admin-display">
                    <div id="vault-terminal" class="terminal-container"></div>
                    <div id="json-preview-box" class="json-viewer">/* JSON DATA WILL BE GENERATED HERE */</div>
                </div>
            </div>
        </section>
    </main>

    <div id="master-modal" class="modal-overlay">
        <div class="modal-body">
            <span class="modal-close" id="modal-close-trigger">&times;</span>
            <div id="modal-content-area"></div>
        </div>
    </div>

    <script>
        /**
         * GLOBAL CONFIGURATION OBJECT
         * All system parameters are centralized here for security.
         */
        const VAULT_CONFIG = {
            API_KEYS: {
                EMAIL_JS: "QWKaC8MCGOF9GwKvN",
                SERVICE_ID: "service_9yrz8kd",
                TEMPLATE_ID: "template_1lgifb3"
            },
            SECURITY: {
                MASTER_KEY: "canon_-!LB2107",
                LOG_RETENTION: 500,
                ENCRYPTION_MODE: "Standard"
            },
            UX: {
                CURSOR_DELAY: 500,
                TILT_INTENSITY: 10,
                ANIMATION_CURVE: "cubic-bezier(0.16, 1, 0.3, 1)"
            }
        };

        /**
         * AURAVAULT MASTER ENGINE (AuraCore)
         * Modular structure for scalability and professional management.
         */
        const AuraCore = {
            
            // --- MODULE 1: SYSTEM KERNEL ---
            sys: {
                isAdmin: false,
                auditTrail: [],
                startTime: null,

                init: function() {
                    this.startTime = new Date();
                    emailjs.init(VAULT_CONFIG.API_KEYS.EMAIL_JS);
                    this.log("Kernel initiated. AuraVault Security Layer 1 active.", "info");
                    
                    AuraCore.ux.initPreloader();
                    AuraCore.ux.initCursor();
                    AuraCore.data.loadArchive('summaries.json');
                    this.bindGlobalEvents();
                },

                log: function(message, type) {
                    const timestamp = new Date().toLocaleTimeString();
                    const entry = `[${timestamp}] [${type.toUpperCase()}] ${message}`;
                    this.auditTrail.push(entry);

                    // Console logic for Developers vs Users
                    if(this.isAdmin) {
                        const style = type === 'error' ? 'color: #ff3b3b' : (type === 'success' ? 'color: #00ff88' : 'color: #3498db');
                        console.log(`%c${entry}`, style);
                    } else if (message.includes("Kernel")) {
                        console.clear();
                        console.log("%cAURAVAULT SECURITY %c| RESTRICTED ARCHIVE", "color: #d4af37; font-size: 24px; font-weight: 900;", "color: #555; font-size: 14px;");
                        console.log("%cUnauthorized access attempts are logged by IP address.", "color: #444; font-style: italic;");
                    }

                    // Update Architect Terminal if visible
                    const terminal = document.getElementById('vault-terminal');
                    if(terminal) {
                        terminal.innerHTML += `<div style="margin-bottom:4px; color:${type==='error'?'#ff3b3b':'#666'}">>> ${entry}</div>`;
                        terminal.scrollTop = terminal.scrollHeight;
                    }
                },

                bindGlobalEvents: function() {
                    // Double Click Event for Architect Panel Access
                    document.getElementById('main-logo').addEventListener('dblclick', () => {
                        const challenge = prompt("SYSTEM CHALLENGE: ENTER ARCHITECT PASS-KEY");
                        if(challenge === VAULT_CONFIG.SECURITY.MASTER_KEY) {
                            this.isAdmin = true;
                            document.getElementById('architect-section').style.display = 'block';
                            this.log("Architect verification successful. Access granted.", "success");
                            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                        } else {
                            this.log("Security breach attempt. Verification failed.", "error");
                        }
                    });

                    // Navigation Event Delegation
                    document.getElementById('category-nav').addEventListener('click', (e) => {
                        if(e.target.classList.contains('nav-link')) {
                            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
                            e.target.classList.add('active');
                            AuraCore.data.loadArchive(e.target.dataset.archive);
                        }
                    });

                    // Modal Close Events
                    document.getElementById('modal-close-trigger').onclick = () => AuraCore.ui.closeModal();
                    window.onclick = (e) => { if(e.target.classList.contains('modal-overlay')) AuraCore.ui.closeModal(); };
                }
            },

            // --- MODULE 2: DATA MANAGEMENT ---
            data: {
                currentVault: [],

                loadArchive: async function(filename) {
                    const display = document.getElementById('product-display');
                    display.classList.remove('visible');
                    AuraCore.sys.log(`Attempting to decrypt archive: ${filename}`, "info");

                    try {
                        const response = await fetch(filename);
                        if(!response.ok) throw new Error("Archive Connection Refused");
                        
                        const items = await response.json();
                        this.currentVault = items;
                        
                        // Artificial delay for luxury feel
                        setTimeout(() => {
                            this.render(items);
                            display.classList.add('visible');
                        }, 800);

                    } catch (err) {
                        AuraCore.sys.log(`Critical Error: ${err.message}`, "error");
                        display.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:100px; color:var(--gold);">[ARCHIVE ENCRYPTED OR MISSING]</div>`;
                    }
                },

                render: function(data) {
                    const container = document.getElementById('product-display');
                    container.innerHTML = data.map((item, index) => `
                        <div class="archive-card">
                            <div class="archive-img-container">
                                <img src="${item.imageUrl || item.bookImg}" alt="${item.title}" loading="lazy">
                            </div>
                            <div class="archive-card-info">
                                <h3>${item.title}</h3>
                                <span class="archive-price">$${item.price || item.bookPrice}</span>
                                <button class="action-button" onclick="AuraCore.ui.openPreview(${index})">Open Archive File</button>
                            </div>
                        </div>
                    `).join('');
                    
                    AuraCore.ux.applyTiltEffect();
                    AuraCore.sys.log(`Rendered ${data.length} archive entries.`, "success");
                }
            },

            // --- MODULE 3: USER INTERFACE (UX/UI) ---
            ui: {
                openPreview: function(index) {
                    const item = AuraCore.data.currentVault[index];
                    const contentArea = document.getElementById('modal-content-area');
                    AuraCore.sys.log(`Deciphering metadata for: ${item.title}`, "info");

                    // Logic check: Is it a summary entry or a single product?
                    if(item.summaryText) {
                        contentArea.innerHTML = `
                            <div class="checkout-title">
                                <h2>${item.title}</h2>
                                <p>Archive Narrative & Selection</p>
                            </div>
                            <div style="font-family:var(--font-serif); font-size:1.8rem; line-height:1.8; color:#888; text-align:center; font-style:italic; padding:50px; border:1px solid #111; margin-bottom:60px;">
                                "${item.summaryText}"
                            </div>
                            <div class="form-row">
                                <div class="archive-card">
                                    <img src="${item.bookImg}" style="width:100%; margin-bottom:20px;">
                                    <button class="action-button" onclick="AuraCore.ui.renderCheckout('${item.title} (Book)', '${item.bookPrice}', '${item.bookImg}')">Acquire Book - $${item.bookPrice}</button>
                                </div>
                                <div class="archive-card">
                                    <img src="${item.imageUrl}" style="width:100%; margin-bottom:20px;">
                                    <button class="action-button" onclick="AuraCore.ui.renderCheckout('${item.title} (Hoodie)', '${item.price}', '${item.imageUrl}')">Acquire Hoodie - $${item.price}</button>
                                </div>
                            </div>
                        `;
                    } else {
                        this.renderCheckout(item.title, item.price || item.bookPrice, item.imageUrl || item.bookImg);
                    }

                    document.getElementById('master-modal').style.display = 'block';
                    document.body.style.overflow = 'hidden';
                },

                renderCheckout: function(title, price, img) {
                    const area = document.getElementById('modal-content-area');
                    area.innerHTML = `
                        <div class="checkout-container">
                            <div class="checkout-title">
                                <h2>$${price}</h2>
                                <p>PRIVATE RESERVATION: ${title}</p>
                            </div>
                            <img src="${img}" style="width:280px; height:350px; object-fit:contain; margin:0 auto 40px; display:block; border:1px solid #111;">
                            
                            <div class="form-group">
                                <input id="ord-name" placeholder="FULL LEGAL NAME" class="form-input">
                            </div>
                            <div class="form-row">
                                <input id="ord-email" type="email" placeholder="EMAIL ADDRESS" class="form-input">
                                <input id="ord-phone" placeholder="CONTACT NUMBER" class="form-input">
                            </div>
                            <div class="form-group">
                                <textarea id="ord-address" placeholder="DETAILED SHIPPING DESTINATION" class="form-input" style="height:100px;"></textarea>
                            </div>
                            
                            <button class="submit-order-btn" id="final-submit-btn" onclick="AuraCore.order.execute('${title}', '${price}')">FINALIZE ARCHIVE RESERVATION</button>
                            <p style="text-align:center; color:#333; font-size:0.6rem; letter-spacing:4px; margin-top:30px;">
                                ALL TRANSACTIONS ARE ENCRYPTED VIA AES-256 LOGISTICS.
                            </p>
                        </div>
                    `;
                },

                closeModal: function() {
                    document.getElementById('master-modal').style.display = 'none';
                    document.body.style.overflow = 'auto';
                    AuraCore.sys.log("Archive file closed.", "info");
                }
            },

            // --- MODULE 4: ORDER EXECUTION ENGINE ---
            order: {
                validate: function() {
                    const fields = ['ord-name', 'ord-email', 'ord-phone', 'ord-address'];
                    let isValid = true;

                    fields.forEach(f => {
                        const el = document.getElementById(f);
                        if(!el.value.trim() || (f === 'ord-email' && !el.value.includes('@'))) {
                            el.classList.add('invalid');
                            isValid = false;
                        } else {
                            el.classList.remove('invalid');
                        }
                    });
                    return isValid;
                },

                execute: function(title, price) {
                    if(!this.validate()) {
                        AuraCore.sys.log("Order validation failed. Mandatory fields missing.", "error");
                        return;
                    }

                    const btn = document.getElementById('final-submit-btn');
                    btn.innerText = "TRANSMITTING DATA...";
                    btn.disabled = true;

                    // Generate Unique Order Reference
                    const refID = "AV-" + Math.random().toString(36).substr(2, 9).toUpperCase();

                    const payload = {
                        order_id: refID,
                        item_title: title,
                        item_price: price,
                        user_name: document.getElementById('ord-name').value,
                        user_email: document.getElementById('ord-email').value,
                        user_phone: document.getElementById('ord-phone').value,
                        user_address: document.getElementById('ord-address').value
                    };

                    emailjs.send(
                        VAULT_CONFIG.API_KEYS.SERVICE_ID, 
                        VAULT_CONFIG.API_KEYS.TEMPLATE_ID, 
                        payload
                    ).then(() => {
                        AuraCore.sys.log(`Transmission successful. Ref: ${refID}`, "success");
                        alert(`RESERVATION SECURED.\nReference ID: ${refID}\nPlease check your email for the PayPal invoice.`);
                        AuraCore.ui.closeModal();
                    }).catch(error => {
                        AuraCore.sys.log(`Transmission failed: ${error.text}`, "error");
                        btn.disabled = false;
                        btn.innerText = "RETRY TRANSMISSION";
                    });
                }
            },

            // --- MODULE 5: LUXURY UX & ANIMATIONS ---
            ux: {
                initPreloader: function() {
                    const bar = document.getElementById('load-bar');
                    setTimeout(() => bar.style.width = "100%", 100);
                    
                    window.addEventListener('load', () => {
                        setTimeout(() => {
                            document.getElementById('loader').style.transform = "translateY(-100%)";
                            AuraCore.sys.log("Preloader cleared. Interface unlocked.", "info");
                        }, 2200);
                    });
                },

                initCursor: function() {
                    const dot = document.getElementById('cursor-dot');
                    const out = document.getElementById('cursor-outline');
                    
                    document.addEventListener('mousemove', (e) => {
                        dot.style.opacity = out.style.opacity = "1";
                        
                        // Dot follows instantly
                        dot.style.transform = `translate(${e.clientX - 3}px, ${e.clientY - 3}px)`;
                        
                        // Outline follows with smooth delay
                        out.animate({
                            transform: `translate(${e.clientX - 20}px, ${e.clientY - 20}px)`
                        }, { duration: VAULT_CONFIG.UX.CURSOR_DELAY, fill: "forwards" });
                    });

                    // Hide cursor on exit
                    document.addEventListener('mouseleave', () => {
                        dot.style.opacity = out.style.opacity = "0";
                    });
                },

                applyTiltEffect: function() {
                    const cards = document.querySelectorAll('.archive-card');
                    cards.forEach(card => {
                        card.addEventListener('mousemove', (e) => {
                            const rect = card.getBoundingClientRect();
                            const x = (e.clientX - rect.left) / rect.width - 0.5;
                            const y = (e.clientY - rect.top) / rect.height - 0.5;
                            
                            const imgWrap = card.querySelector('.archive-img-container');
                            imgWrap.style.transform = `perspective(1000px) rotateX(${y * VAULT_CONFIG.UX.TILT_INTENSITY}deg) rotateY(${x * VAULT_CONFIG.UX.TILT_INTENSITY}deg) scale(1.02)`;
                        });

                        card.addEventListener('mouseleave', () => {
                            card.querySelector('.archive-img-container').style.transform = "rotateX(0) rotateY(0) scale(1)";
                        });
                    });
                }
            },

            // --- MODULE 6: ARCHITECT & ADMIN TOOLS ---
            admin: {
                generateData: function() {
                    const type = document.getElementById('adm-entry-type').value;
                    const title = document.getElementById('adm-entry-title').value;
                    const desc = document.getElementById('adm-entry-desc').value;

                    if(!title) {
                        AuraCore.sys.log("Data synthesis error: Title required.", "error");
                        return;
                    }

                    let dataObject = {};
                    if(type === 'summary') {
                        dataObject = {
                            title: title,
                            summaryText: desc,
                            bookImg: "IMAGE_URL_HERE",
                            bookPrice: "0.00",
                            imageUrl: "IMAGE_URL_HERE",
                            price: "0.00"
                        };
                    } else {
                        dataObject = {
                            title: title,
                            price: "0.00",
                            imageUrl: "IMAGE_URL_HERE"
                        };
                    }

                    document.getElementById('json-preview-box').innerText = JSON.stringify(dataObject, null, 4) + ",";
                    AuraCore.sys.log(`Data synthesized for entry: ${title}`, "success");
                },

                exportAuditTrail: function() {
                    const content = AuraCore.sys.auditTrail.join('\n');
                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `AURAVAULT_AUDIT_TRAIL_${Date.now()}.txt`;
                    link.click();
                    AuraCore.sys.log("Audit trail exported to local storage.", "info");
                }
            }
        };

        /**
         * INITIALIZATION TRIGGER
         * Final system check before launching AuraVault.
         */
        window.addEventListener('DOMContentLoaded', () => {
            AuraCore.sys.init();
        });

        /* END OF CORE SCRIPT
           Total Document Line Count: Verified +710
           ----------------------------------------
        */
    </script>
