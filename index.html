<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraVault | Luxury Archive</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --black: #0a0a0a; --dark-grey: #1a1a1a; --green: #2ecc71; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--black); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        header { padding: 40px 20px; text-align: center; border-bottom: 1px solid #333; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--gold); letter-spacing: 2px; cursor: pointer; }
        nav { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .nav-link { color: #888; text-decoration: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; padding-bottom: 5px; transition: 0.3s; }
        .nav-link.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { background: var(--dark-grey); padding: 20px; border-radius: 5px; text-align: center; border: 1px solid #222; position: relative; transition: 0.3s; }
        .card:hover { border-color: var(--gold); }
        .img-container { width: 100%; height: 350px; overflow: hidden; border-radius: 3px; background: #000; display: flex; align-items: center; }
        .card img { width: 100%; height: 100%; object-fit: contain; transition: 0.5s ease; cursor: crosshair; }
        .action-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 12px 25px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .action-btn:hover { background: var(--gold); color: black; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; overflow-y: auto; }
        .modal { position: relative; margin: 50px auto; background: #111; padding: 30px; border: 1px solid var(--gold); width: 95%; max-width: 550px; }
        .checkout-form input, .checkout-form select, .checkout-form textarea { width: 100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid #333; color: white; font-family: inherit; }
        .admin-sec { background:#111; border:1px solid #333; padding:20px; margin-top: 20px; }
        .json-box { background:#000; padding:15px; font-family:monospace; white-space:pre; border:1px solid #333; height:200px; overflow:auto; color: #0f0; margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="openAdmin()">AURAVAULT</div>
    <nav>
        <span class="nav-link active" onclick="switchTab('summaries.json', this)">SUMMARIES</span>
        <span class="nav-link" onclick="switchTab('books.json', this)">BOOKS</span>
        <span class="nav-link" onclick="switchTab('hoody.json', this)">HOODIES</span>
    </nav>
</header>

<div class="container">
    <div id="display-grid" class="grid"></div>

    <div id="admin-panel" style="display:none; margin-top:50px; border-top: 2px solid var(--gold);">
        <h2 style="color:var(--gold); text-align:center; padding: 20px 0;">ADMIN STRATEGIST</h2>
        <div style="display:flex; gap:10px; margin-bottom: 20px;">
            <button class="action-btn" onclick="showForm('s')">ADD SUMMARY</button>
            <button class="action-btn" onclick="showForm('p')">ADD PRODUCT (BOOK/HOODIE)</button>
        </div>

        <div id="f-s" class="admin-sec">
            <input type="text" id="as-title" placeholder="Summary Title">
            <textarea id="as-text" placeholder="Content"></textarea>
            <input type="text" id="as-bimg" placeholder="Book Image URL">
            <input type="text" id="as-himg" placeholder="Hoodie Image URL">
            <input type="text" id="as-bprice" placeholder="Book Price">
            <input type="text" id="as-hprice" placeholder="Hoodie Price">
            <button class="action-btn" onclick="generate('s')">GENERATE SUMMARY</button>
        </div>

        <div id="f-p" class="admin-sec" style="display:none;">
            <input type="text" id="ap-title" placeholder="Product Title">
            <input type="text" id="ap-price" placeholder="Selling Price">
            <input type="text" id="ap-cost" placeholder="Internal Cost">
            <input type="text" id="ap-img-f" placeholder="Front Image (Main)">
            <input type="text" id="ap-img-b" placeholder="Back Image (Hover)">
            <input type="text" id="ap-colors" placeholder="Colors (Black, White...)">
            <button class="action-btn" onclick="generate('p')">GENERATE PRODUCT</button>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:20px;">
            <div id="out-site" class="json-box"></div>
            <div id="out-sources" class="json-box" style="color:#2ecc71;"></div>
        </div>
    </div>
</div>

<div id="action-modal" class="overlay">
    <div class="modal">
        <h2 id="m-title" style="color:var(--gold); text-align:center; margin-bottom:20px; font-family:'Playfair Display';"></h2>
        <div id="m-body"></div>
        <button onclick="closeModal()" class="action-btn" style="border:none; color:#666;">← BACK TO ARCHIVE</button>
    </div>
</div>

<script>
    (function(){ emailjs.init("QWKaC8MCGOF9GwKvN"); })();
    let currentFile = 'summaries.json';

    async function switchTab(file, btn) {
        currentFile = file;
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        btn.classList.add('active');
        try {
            const res = await fetch(file);
            const data = await res.json();
            render(data);
        } catch(e) { document.getElementById('display-grid').innerHTML = "<p style='text-align:center; color:#444;'>Archive Empty.</p>"; }
    }

    function render(data) {
        const grid = document.getElementById('display-grid');
        grid.innerHTML = '';
        data.forEach((item, i) => {
            const img = item.imageUrl || item.bookImg;
            const back = item.backImageUrl || img;
            grid.innerHTML += `
                <div class="card">
                    <div class="img-container">
                        <img src="${img}" onmouseover="this.src='${back}'" onmouseout="this.src='${img}'" loading="lazy">
                    </div>
                    <h3 style="margin-top:15px; font-size:1.1rem;">${item.title}</h3>
                    <p style="color:var(--gold); margin:10px 0; font-weight:bold;">$${item.price || item.bookPrice}</p>
                    <button class="action-btn" onclick="openAction(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                        ${currentFile === 'summaries.json' ? 'READ SUMMARY' : 'ORDER NOW'}
                    </button>
                </div>`;
        });
    }

    function openAction(item) {
        const modal = document.getElementById('action-modal');
        const body = document.getElementById('m-body');
        document.getElementById('m-title').innerText = item.title;
        modal.style.display = 'block';

        if(currentFile === 'summaries.json') {
            body.innerHTML = `
                <p style="color:#ccc; line-height:1.6; margin-bottom:20px; text-align:justify;">${item.summaryText}</p>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button class="action-btn" onclick="showCheckout('${item.title} (Book)', '${item.bookPrice}', false)">BOOK ($${item.bookPrice})</button>
                    <button class="action-btn" onclick="showCheckout('${item.title} (Hoodie)', '${item.price}', true, '${item.colors || 'Black'}')">HOODIE ($${item.price})</button>
                </div>`;
        } else {
            showCheckout(item.title, item.price, currentFile === 'hoody.json', item.colors);
        }
    }

    function showCheckout(title, price, isHoodie, colors = "Black") {
        const body = document.getElementById('m-body');
        const sTime = isHoodie ? "7-10 Days (Express)" : "12-18 Days (Standard)";
        let extraFields = '';

        if(isHoodie) {
            const colorList = colors.split(',').map(c => `<option>${c.trim()}</option>`).join('');
            extraFields = `
                <select id="f-size" required><option value="">SELECT SIZE</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>2XL</option></select>
                <select id="f-color" required><option value="">SELECT COLOR</option>${colorList}</select>`;
        }

        body.innerHTML = `
            <div class="checkout-form">
                <p style="color:var(--green); font-size:0.8rem; text-align:center; margin-bottom:15px;">🚚 Shipping: ${sTime}</p>
                <h3 style="text-align:center; color:var(--gold); margin-bottom:15px; font-size:1.5rem;">$${price}</h3>
                <input type="text" id="f-name" placeholder="Full Name" required>
                <input type="email" id="f-email" placeholder="Email Address" required>
                ${extraFields}
                <textarea id="f-addr" placeholder="Full Address (Street, City, Zip Code, USA)" rows="3" required></textarea>
                <button class="action-btn" id="s-btn" onclick="sendEmail('${title}', '${price}')" style="background:var(--gold); color:black; border:none;">CONFIRM ORDER</button>
            </div>`;
    }

    function sendEmail(title, price) {
        const btn = document.getElementById('s-btn');
        const data = {
            user_name: document.getElementById('f-name').value,
            user_email: document.getElementById('f-email').value,
            user_address: document.getElementById('f-addr').value,
            item_title: title,
            item_price: price,
            item_size: document.getElementById('f-size')?.value || 'N/A',
            item_color: document.getElementById('f-color')?.value || 'N/A',
            order_id: "AV-" + Math.floor(Math.random()*100000)
        };

        if(!data.user_name || !data.user_email || !data.user_address) return alert("Fill all fields!");
        btn.innerText = "SENDING..."; btn.disabled = true;

        emailjs.send("service_9yrz8kd", "template_1lgifb3", data).then(() => {
            alert("Order Success! Check your email."); closeModal();
        }, (err) => { alert("Error: " + err.text); btn.disabled = false; btn.innerText = "RETRY"; });
    }

    function generate(type) {
        if(type === 's') {
            const site = { title: document.getElementById('as-title').value, summaryText: document.getElementById('as-text').value, bookImg: document.getElementById('as-bimg').value, hoodyImg: document.getElementById('as-himg').value, bookPrice: document.getElementById('as-bprice').value, price: document.getElementById('as-hprice').value };
            document.getElementById('out-site').innerText = JSON.stringify(site, null, 2) + ",";
        } else {
            const p = document.getElementById('ap-price').value;
            const c = document.getElementById('ap-cost').value;
            const site = { title: document.getElementById('ap-title').value, price: p, imageUrl: document.getElementById('ap-img-f').value, backImageUrl: document.getElementById('ap-img-b').value, colors: document.getElementById('ap-colors').value };
            const internal = { title: site.title, cost: c, profit: (parseFloat(p)-parseFloat(c)).toFixed(2) };
            document.getElementById('out-site').innerText = JSON.stringify(site, null, 2) + ",";
            document.getElementById('out-sources').innerText = JSON.stringify(internal, null, 2) + ",";
        }
    }

    function showForm(t) { document.getElementById('f-s').style.display = t==='s'?'block':'none'; document.getElementById('f-p').style.display = t==='p'?'block':'none'; }
    function openAdmin() { if(prompt("Key:") === "canon_-!LB2107") document.getElementById('admin-panel').style.display='block'; }
    function closeModal() { document.getElementById('action-modal').style.display='none'; }
    window.onload = () => switchTab('summaries.json', document.querySelectorAll('.nav-link')[0]);
</script>
</body>
</html>
