<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | AuraVault Delivery</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --card: #121212; --text: #ffffff; --border: #262626; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; }

        .checkout-container { max-width: 600px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 15px; }
        h2 { color: var(--gold); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

        label { display: block; font-size: 0.7rem; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 0.9rem; transition: 0.3s; }
        input:focus { border-color: var(--gold); outline: none; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .order-summary { background: #000; padding: 20px; border: 1px dashed var(--gold); border-radius: 10px; margin-top: 20px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .total-price { font-size: 1.3rem; color: var(--gold); font-weight: 800; border-top: 1px solid #222; padding-top: 10px; margin-top: 10px; display: flex; justify-content: space-between; }

        .confirm-btn { background: var(--gold); color: black; border: none; padding: 18px; width: 100%; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 25px; transition: 0.3s; font-size: 1rem; }
        .confirm-btn:hover { background: #c5a02d; }
        .confirm-btn:disabled { background: #555; cursor: not-allowed; }

        .optional-tag { color: #555; font-size: 0.65rem; text-transform: lowercase; margin-left: 4px; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h2>Shipping Details</h2>
        
        <form id="checkout-form">
            <label>Full Name</label>
            <input type="text" id="cust-name" placeholder="First and Last Name" required>

            <label>Company <span class="optional-tag">(Optional)</span></label>
            <input type="text" id="cust-enterprise" placeholder="Company name if applicable">

            <label>Address Line 1</label>
            <input type="text" id="cust-addr1" placeholder="Street address, P.O. box" required>

            <label>Address Line 2 <span class="optional-tag">(Optional)</span></label>
            <input type="text" id="cust-addr2" placeholder="Apartment, suite, unit, etc.">

            <div class="form-row">
                <div>
                    <label>City</label>
                    <input type="text" id="cust-city" placeholder="City" required>
                </div>
                <div>
                    <label>ZIP Code</label>
                    <input type="text" id="cust-zip" placeholder="Zip code" required>
                </div>
            </div>

            <label>Phone Number</label>
            <input type="tel" id="cust-phone" placeholder="+1 000 000 0000" required>

            <div class="form-row">
                <div>
                    <label>Size</label>
                    <select id="cust-size" required onchange="updateTotal()"></select>
                </div>
                <div>
                    <label>Color</label>
                    <select id="cust-color" required></select>
                </div>
            </div>

            <label>Quantity</label>
            <input type="number" id="cust-qty" value="1" min="1" max="10" onchange="updateTotal()">

            <div class="order-summary">
                <div class="summary-item">
                    <span>Product:</span>
                    <span id="summary-product-name">---</span>
                </div>
                <div class="summary-item">
                    <span>Reference:</span>
                    <span id="summary-id" style="font-size:0.7rem; color:#666;">---</span>
                </div>
                <div class="total-price">
                    <span>Total:</span>
                    <span id="summary-total">$0.00</span>
                </div>
                <p style="color:#4caf50; font-size:0.7rem; margin-top:10px; font-weight:bold; text-align:center;">🇺🇸 FREE 2-DAY USA SHIPPING</p>
            </div>

            <button type="submit" class="confirm-btn" id="submit-btn">Complete Reservation</button>
        </form>
    </div>

    <script>
        emailjs.init("QWKaC8MCGOF9GwKvN");

        const product = JSON.parse(localStorage.getItem('selectedProduct'));
        const orderType = localStorage.getItem('checkoutType');
        const orderID = "#AV-" + Math.floor(10000 + Math.random() * 90000);

        if(!product) { window.location.href = "index.html"; }

        document.getElementById('summary-product-name').innerText = product.title;
        document.getElementById('summary-id').innerText = orderID;

        const colorSelect = document.getElementById('cust-color');
        product.colors.split(',').forEach(c => {
            let opt = document.createElement('option');
            opt.value = c.trim(); opt.innerText = c.trim();
            colorSelect.appendChild(opt);
        });

        const sizeSelect = document.getElementById('cust-size');
        if(orderType === 'pack') {
            sizeSelect.innerHTML = `<option value="${product.price_pack}">Full Bundle (All Sizes)</option>`;
        } else {
            const sizes = [
                {n: 'S', p: product.p_std}, {n: 'M', p: product.p_std}, {n: 'L', p: product.p_std},
                {n: 'XL', p: product.p_xl}, {n: '2XL', p: product.p_2xl}, {n: '3XL', p: product.p_3xl}
            ];
            sizes.forEach(s => {
                if(s.p) {
                    let opt = document.createElement('option');
                    opt.value = s.p; opt.innerText = s.n;
                    sizeSelect.appendChild(opt);
                }
            });
        }

        function updateTotal() {
            const price = parseFloat(sizeSelect.value);
            const qty = parseInt(document.getElementById('cust-qty').value);
            document.getElementById('summary-total').innerText = "$" + (price * qty).toFixed(2);
        }
        updateTotal();

        document.getElementById('checkout-form').onsubmit = function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const formData = {
                order_id: orderID,
                product: product.title,
                type: orderType,
                name: document.getElementById('cust-name').value,
                enterprise: document.getElementById('cust-enterprise').value || "N/A",
                address1: document.getElementById('cust-addr1').value,
                address2: document.getElementById('cust-addr2').value || "N/A",
                city: document.getElementById('cust-city').value,
                zip: document.getElementById('cust-zip').value,
                phone: document.getElementById('cust-phone').value,
                size: sizeSelect.options[sizeSelect.selectedIndex].text,
                color: colorSelect.value,
                qty: document.getElementById('cust-qty').value,
                total: document.getElementById('summary-total').innerText
            };

            emailjs.send("service_9yrz8kd", "template_1lgifb3", formData)
            .then(() => {
                alert("Order Sent! Reference: " + orderID);
                window.location.href = "index.html";
            }, (err) => {
                alert("Error sending. Try again.");
                btn.disabled = false;
                btn.innerText = "Complete Reservation";
            });
        };
    </script>
</body>
</html>
