<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraVault | Luxury Archive & Supply</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@200;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================
           1. DESIGN SYSTEM (COLORS & CONSTANTS)
           ========================================
        */
        :root {
            --gold: #d4af37;
            --gold-bright: #f1c40f;
            --bg: #050505;
            --card: #0d0d0d;
            --border: #1a1a1a;
            --text-p: #888;
            --text-h: #fff;
            --success: #27ae60;
            --error: #c0392b;
            --transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { 
            background: var(--bg); color: var(--text-h); 
            font-family: 'Inter', sans-serif; overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ========================================
           2. GLOBAL ANIMATIONS
           ========================================
        */
        @keyframes reveal { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes skeleton { 0% { background: #0d0d0d; } 50% { background: #1a1a1a; } 100% { background: #0d0d0d; } }
        @keyframes gold-glow { 0% { box-shadow: 0 0 5px rgba(212,175,55,0.2); } 50% { box-shadow: 0 0 20px rgba(212,175,55,0.5); } 100% { box-shadow: 0 0 5px rgba(212,175,55,0.2); } }

        /* ========================================
           3. NAVIGATION & HEADER
           ========================================
        */
        .top-banner {
            background: var(--gold); color: #000; text-align: center;
            padding: 12px; font-size: 0.7rem; font-weight: 900;
            letter-spacing: 3px; text-transform: uppercase;
            position: sticky; top: 0; z-index: 9999;
        }

        header { padding: 80px 20px 40px; text-align: center; }
        .logo {
            font-family: 'Playfair Display', serif; font-size: 3.5rem;
            color: var(--gold); letter-spacing: 15px; font-weight: 900;
            cursor: pointer; transition: var(--transition);
        }
        .logo:hover { letter-spacing: 20px; opacity: 0.8; }

        nav { display: flex; justify-content: center; gap: 30px; margin-top: 40px; flex-wrap: wrap; }
        .nav-link {
            color: var(--text-p); font-size: 0.65rem; font-weight: 800;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
            padding: 10px 0; border-bottom: 2px solid transparent;
            transition: var(--transition);
        }
        .nav-link:hover, .nav-link.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        /* ========================================
           4. PRODUCT GRID & CARDS
           ========================================
        */
        .main-container { max-width: 1400px; margin: 0 auto; padding: 50px 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; }
        
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 25px; transition: var(--transition);
            animation: reveal 0.8s ease forwards; position: relative;
        }
        .card:hover { border-color: var(--gold); transform: translateY(-10px); }

        .badge {
            position: absolute; top: 35px; left: 35px; background: var(--gold);
            color: #000; padding: 5px 12px; font-size: 0.6rem; font-weight: 900;
            border-radius: 4px; z-index: 10;
        }

        .img-container {
            position: relative; width: 100%; aspect-ratio: 1 / 1.25;
            overflow: hidden; border-radius: 12px; margin-bottom: 25px;
            background: #111;
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: 1.5s ease; }
        .img-back { position: absolute; top: 0; left: 0; opacity: 0; }
        .card:hover .img-front { opacity: 0; }
        .card:hover .img-back { opacity: 1; transform: scale(1.1); }

        .info h3 { font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 10px; font-weight: 400; }
        .price { color: var(--gold); font-size: 1.5rem; font-weight: 900; margin-bottom: 20px; }

        .btn {
            width: 100%; padding: 18px; border-radius: 10px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            transition: var(--transition); border: none; font-size: 0.8rem;
        }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-gold:hover { background: #fff; transform: scale(1.02); }
        .btn-outline { background: transparent; border: 1px solid #333; color: #666; margin-top: 10px; }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

        /* ========================================
           5. CHECKOUT & LOGISTICS
           ========================================
        */
        .view { display: none; }
        .view.active { display: block; }
        
        .checkout-layout {
            max-width: 1100px; margin: 50px auto; display: grid;
            grid-template-columns: 1.2fr 0.8fr; gap: 40px; padding: 0 20px;
        }
        .form-box { background: var(--card); padding: 40px; border-radius: 25px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: var(--text-p); font-size: 0.7rem; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        input, select, textarea {
            width: 100%; background: #000; border: 1px solid #222; padding: 15px;
            color: #fff; border-radius: 8px; font-family: inherit; transition: 0.3s;
        }
        input:focus { border-color: var(--gold); }

        .summary-box {
            background: #000; padding: 30px; border-radius: 20px; border: 1px solid var(--gold);
            height: fit-content; position: sticky; top: 120px; animation: gold-glow 3s infinite;
        }

        /* ========================================
           6. REVIEWS & COMMENTS SYSTEM
           ========================================
        */
        .reviews-area { margin-top: 50px; border-top: 1px solid #1a1a1a; padding-top: 30px; }
        .review-card {
            background: #0a0a0a; padding: 20px; border-radius: 12px; margin-bottom: 15px;
            border-left: 4px solid var(--gold); animation: reveal 0.5s ease;
        }
        .rev-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .rev-user { font-weight: 800; color: var(--gold); font-size: 0.85rem; }
        .rev-date { font-size: 0.7rem; color: #444; }
        .rev-text { color: #ccc; font-size: 0.9rem; line-height: 1.6; }

        /* ========================================
           7. ADMIN PANEL (HIDDEN)
           ========================================
        */
        .admin-trigger { opacity: 0.05; cursor: pointer; position: fixed; bottom: 0; left: 0; padding: 20px; z-index: 10; }
        .admin-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0d0d0d; border: 2px solid var(--gold); padding: 40px;
            z-index: 10000; border-radius: 20px; width: 90%; max-width: 600px;
            display: none; box-shadow: 0 0 100px #000;
        }

        /* ========================================
           8. FLOATING ELEMENTS
           ========================================
        */
        .whatsapp-link {
            position: fixed; bottom: 40px; right: 40px; background: #25d366;
            width: 65px; height: 65px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; z-index: 999;
            box-shadow: 0 10px 30px rgba(37,211,102,0.3); transition: 0.3s;
        }
        .whatsapp-link:hover { transform: scale(1.1) rotate(10deg); }

        .skeleton { height: 400px; border-radius: 20px; animation: skeleton 1.5s infinite; }

    </style>
</head>
<body>

    <div class="top-banner">🇺🇸 ARCHIVE SUPPLY: FREE 2-DAY SHIPPING IN UNITED STATES</div>

    <div id="view-shop" class="view active">
        <header>
            <div class="logo" onclick="location.reload()">AURAVAULT</div>
            <nav id="categories-nav"></nav>
        </header>

        <main class="main-container">
            <div id="product-grid" class="grid">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>
        </main>
    </div>

    <div id="view-checkout" class="view">
        <header><div class="logo" onclick="app.showShop()">AURAVAULT</div></header>
        
        <div class="checkout-layout">
            <div class="form-container">
                <div class="form-box">
                    <h2 style="margin-bottom:25px; font-family:'Playfair Display'; color:var(--gold)">Shipping Logistics</h2>
                    <div class="form-group">
                        <label>Receiver Name</label>
                        <input type="text" id="cust-name" placeholder="First & Last Name">
                    </div>
                    <div class="form-group">
                        <label>Company / Building (Optional)</label>
                        <input type="text" id="cust-comp" placeholder="e.g. Suite 402">
                    </div>
                    <div class="form-group">
                        <label>Address Line 1</label>
                        <input type="text" id="cust-addr" placeholder="Street Address">
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px">
                        <div class="form-group"><label>City</label><input type="text" id="cust-city"></div>
                        <div class="form-group"><label>ZIP Code</label><input type="text" id="cust-zip"></div>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="cust-phone" placeholder="+1 (___) ___-____">
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top:20px; border-top:1px solid #222; padding-top:20px">
                        <div class="form-group"><label>Archive Size</label><select id="cust-size" onchange="app.calc()"></select></div>
                        <div class="form-group"><label>Variant Color</label><select id="cust-color"></select></div>
                    </div>
                    <button class="btn btn-gold" style="margin-top:20px" onclick="app.placeOrder()">Finalize Reservation</button>
                </div>

                <div class="reviews-area">
                    <h3 style="margin-bottom:20px; font-size:0.9rem; letter-spacing:2px">ARTIFACT FEEDBACK</h3>
                    <div id="reviews-list">
                        </div>
                    <div style="background:#0d0d0d; padding:25px; border-radius:15px; margin-top:20px; border:1px solid #1a1a1a">
                        <p style="font-size:0.6rem; color:var(--gold); margin-bottom:10px; font-weight:900">SUBMIT ARCHIVE FEEDBACK</p>
                        <textarea id="new-rev-text" placeholder="Write your experience with this piece..." style="height:80px; margin-bottom:10px"></textarea>
                        <button class="btn btn-outline" style="padding:10px" onclick="app.postReview()">Post Anonymously</button>
                    </div>
                </div>
            </div>

            <div class="summary-box">
                <h3 id="sum-prod-title" style="margin-bottom:10px; font-family:'Playfair Display'">Product Name</h3>
                <p id="sum-ref" style="font-size:0.6rem; color:#555; margin-bottom:20px">REF: #AV-00000</p>
                <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:10px">
                    <span>Quantity:</span>
                    <input type="number" id="cust-qty" value="1" min="1" max="10" onchange="app.calc()" style="width:50px; background:none; border:1px solid #333; color:white; padding:2px">
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:10px">
                    <span>Shipping:</span>
                    <span style="color:var(--success)">FREE (USA)</span>
                </div>
                <div style="margin-top:20px; border-top:1px solid #222; padding-top:20px; display:flex; justify-content:space-between; font-size:1.6rem; font-weight:900; color:var(--gold)">
                    <span>TOTAL:</span>
                    <span id="sum-total">$0.00</span>
                </div>
            </div>
        </div>
    </div>

    <div id="admin-modal" class="admin-modal">
        <h2 style="color:var(--gold); margin-bottom:20px">VAULT MASTER COMMAND</h2>
        <div class="form-group">
            <label>Customer Display Name (Fake)</label>
            <input type="text" id="adm-rev-user" placeholder="e.g. David R.">
        </div>
        <div class="form-group">
            <label>Comment Content</label>
            <textarea id="adm-rev-text" style="height:100px"></textarea>
        </div>
        <button class="btn btn-gold" onclick="app.admInjectReview()">Inject to Current Product</button>
        <button class="btn btn-outline" onclick="app.closeAdmin()">Close</button>
    </div>

    <a href="https://wa.me/212717948663" class="whatsapp-link" target="_blank">
        <svg style="width:32px;height:32px" viewBox="0 0 24 24"><path fill="#fff" d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42 1.56 1.56 2.41 3.63 2.41 5.83 0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.19-.3a8.132 8.132 0 0 1-1.26-4.38c.01-4.54 3.7-8.24 8.24-8.24m-3.53 3.03c-.19 0-.43.07-.66.33-.23.25-.87.86-.87 2.1s.9 2.44 1.03 2.61c.13.17 1.76 2.68 4.26 3.76.59.26 1.05.41 1.41.53.6.19 1.15.16 1.58.1.48-.07 1.48-.6 1.69-1.19.21-.58.21-1.09.14-1.19-.07-.1-.24-.17-.51-.3s-1.59-.78-1.84-.87-.43-.13-.6.13c-.17.26-.66.86-.81 1.03-.14.17-.29.19-.56.06-.26-.13-1.11-.41-2.11-1.31-.78-.69-1.3-1.55-1.45-1.81-.15-.26-.02-.4.12-.53.12-.11.26-.31.4-.46.13-.15.17-.26.26-.43.09-.17.04-.32-.02-.45-.06-.13-.6-1.45-.82-1.99-.21-.52-.43-.45-.6-.45z"/></svg>
    </a>

    <div class="admin-trigger" onclick="app.openAdmin()">VAULT_ADMIN</div>

    <script>
        /**
         * AuraVault Core Module
         */
        const app = {
            state: {
                selected: null,
                orderType: 'single',
                cats: ['packs.json', 'hoody.json', 'tshirts.json', 'pants.json', 'caps.json'],
                orderID: ''
            },

            init: function() {
                emailjs.init("QWKaC8MCGOF9GwKvN");
                this.renderCats();
                this.load('packs.json');
            },

            renderCats: function() {
                const nav = document.getElementById('categories-nav');
                this.state.cats.forEach((c, i) => {
                    const btn = document.createElement('span');
                    btn.className = `nav-link ${i===0?'active':''}`;
                    btn.innerText = c.split('.')[0].toUpperCase();
                    btn.onclick = (e) => {
                        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                        e.target.classList.add('active');
                        this.load(c);
                    };
                    nav.appendChild(btn);
                });
            },

            load: async function(file) {
                const grid = document.getElementById('product-grid');
                grid.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
                try {
                    const res = await fetch(file);
                    const data = await res.json();
                    grid.innerHTML = '';
                    data.forEach(item => {
                        const isPack = file === 'packs.json';
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            ${isPack?'<div class="badge">LIMITED PACK</div>':''}
                            <div class="img-container">
                                <img src="${item.imgF}" class="img-front">
                                <img src="${item.imgB||item.imgF}" class="img-back">
                            </div>
                            <div class="info">
                                <h3>${item.title}</h3>
                                <div class="price">$${isPack ? item.price_pack : item.p_std}</div>
                                <button class="btn btn-gold" onclick='app.goCheckout(${JSON.stringify(item)}, "${isPack?'pack':'single'}")'>Acquire Now</button>
                                ${isPack?`<button class="btn btn-outline" onclick='app.goCheckout(${JSON.stringify(item)}, "single")'>Buy Piece Only</button>`:''}
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } catch(e) { grid.innerHTML = '<p>Archive node disconnected.</p>'; }
            },

            goCheckout: function(prod, type) {
                this.state.selected = prod;
                this.state.orderType = type;
                this.state.orderID = "#AV-" + Math.floor(100000 + Math.random() * 900000);

                document.getElementById('sum-prod-title').innerText = prod.title;
                document.getElementById('sum-ref').innerText = "REF: " + this.state.orderID;

                // Build Sizes
                const sz = document.getElementById('cust-size'); sz.innerHTML = '';
                if(type === 'pack') {
                    sz.innerHTML = `<option value="${prod.price_pack}">Full Bundle (All Sizes)</option>`;
                } else {
                    const sizes = [
                        {n:'Small', p:prod.p_std}, {n:'Medium', p:prod.p_std}, {n:'Large', p:prod.p_std},
                        {n:'XL', p:prod.p_xl}, {n:'2XL', p:prod.p_2xl}, {n:'3XL', p:prod.p_3xl}
                    ];
                    sizes.forEach(s => { if(s.p) sz.innerHTML += `<option value="${s.p}">${s.n}</option>`; });
                }

                // Build Colors
                const col = document.getElementById('cust-color'); col.innerHTML = '';
                prod.colors.split(',').forEach(c => col.innerHTML += `<option value="${c.trim()}">${c.trim()}</option>`);

                this.calc();
                this.renderReviews();
                this.switchView('view-checkout');
            },

            calc: function() {
                const p = parseFloat(document.getElementById('cust-size').value) || 0;
                const q = parseInt(document.getElementById('cust-qty').value) || 1;
                document.getElementById('sum-total').innerText = "$" + (p * q).toFixed(2);
            },

            switchView: function(id) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                window.scrollTo(0,0);
            },

            showShop: function() { this.switchView('view-shop'); },

            /** REVIEWS ENGINE **/
            postReview: function() {
                const txt = document.getElementById('new-rev-text').value;
                if(!txt) return;
                this.saveReview('Anonymous Collector', txt);
                document.getElementById('new-rev-text').value = '';
                this.renderReviews();
            },

            saveReview: function(user, text) {
                const reviews = JSON.parse(localStorage.getItem('vault_revs') || '[]');
                reviews.push({
                    prod: this.state.selected.title,
                    user: user,
                    text: text,
                    date: new Date().toLocaleDateString()
                });
                localStorage.setItem('vault_revs', JSON.stringify(reviews));
            },

            renderReviews: function() {
                const box = document.getElementById('reviews-list');
                const reviews = JSON.parse(localStorage.getItem('vault_revs') || '[]');
                const filtered = reviews.filter(r => r.prod === this.state.selected.title);
                
                if(filtered.length === 0) {
                    box.innerHTML = '<p style="font-size:0.7rem; color:#444">No artifacts logs for this piece yet.</p>';
                    return;
                }
                
                box.innerHTML = filtered.reverse().map(r => `
                    <div class="review-card">
                        <div class="rev-header">
                            <span class="rev-user">${r.user}</span>
                            <span class="rev-date">${r.date}</span>
                        </div>
                        <p class="rev-text">${r.text}</p>
                    </div>
                `).join('');
            },

            /** ADMIN COMMANDS **/
            openAdmin: function() { document.getElementById('admin-modal').style.display = 'block'; },
            closeAdmin: function() { document.getElementById('admin-modal').style.display = 'none'; },
            admInjectReview: function() {
                const u = document.getElementById('adm-rev-user').value;
                const t = document.getElementById('adm-rev-text').value;
                if(!u || !t) return;
                this.saveReview(u, t);
                this.renderReviews();
                this.closeAdmin();
            },

            /** ORDER SUBMISSION **/
            placeOrder: function() {
                const btn = document.querySelector('.btn-gold');
                btn.innerText = "Transmitting to Vault...";
                btn.disabled = true;

                const payload = {
                    order_id: this.state.orderID,
                    product_name: this.state.selected.title,
                    customer_name: document.getElementById('cust-name').value,
                    enterprise: document.getElementById('cust-comp').value || "Individual",
                    address_1: document.getElementById('cust-addr').value,
                    city: document.getElementById('cust-city').value,
                    zip_code: document.getElementById('cust-zip').value,
                    phone: document.getElementById('cust-phone').value,
                    size: document.getElementById('cust-size').options[document.getElementById('cust-size').selectedIndex].text,
                    color: document.getElementById('cust-color').value,
                    qty: document.getElementById('cust-qty').value,
                    total_price: document.getElementById('sum-total').innerText
                };

                emailjs.send("service_9yrz8kd", "template_1lgifb3", payload)
                .then(() => {
                    alert("Order Confirmed. Vault Reference: " + this.state.orderID);
                    location.reload();
                })
                .catch(() => {
                    alert("Transmission Error. Check Connection.");
                    btn.disabled = false; btn.innerText = "Finalize Reservation";
                });
            }
        };

        // RUN APPLICATION
        app.init();
    </script>
</body>
</html>
