<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraVault | Luxury Archive</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Inter:wght@200;300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- DESIGN TOKENS --- */
        :root {
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.2);
            --black: #0a0a0a;
            --dark-grey: #121212;
            --border: #262626;
            --radius-lg: 12px;
            --radius-sm: 8px;
            --transition-fluid: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* --- GLOBAL RESET & SCROLLBAR --- */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--black); }
        ::-webkit-scrollbar-thumb { background: var(--gold); }

        body { 
            background: var(--black); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            line-height: 1.7; 
            overflow-x: hidden; 
        }

        /* --- LUXURY HEADER --- */
        header { padding: 120px 20px 60px; text-align: center; position: relative; }
        .logo { 
            font-family: 'Playfair Display', serif; 
            font-size: 3.8rem; 
            color: var(--gold); 
            letter-spacing: 14px; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: var(--transition-fluid);
            text-shadow: 0 0 20px var(--gold-glow);
        }
        .logo:hover { letter-spacing: 18px; opacity: 0.8; transform: scale(1.02); }

        nav { display: flex; justify-content: center; gap: 55px; margin-top: 50px; }
        .nav-link { 
            color: #555; 
            text-decoration: none; 
            font-size: 0.75rem; 
            font-weight: 600; 
            letter-spacing: 4px; 
            cursor: pointer; 
            transition: 0.4s; 
            text-transform: uppercase; 
            padding-bottom: 8px;
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 1px;
            background: var(--gold);
            transition: 0.4s;
        }
        .nav-link.active, .nav-link:hover { color: var(--gold); }
        .nav-link.active::after { width: 100%; }

        /* --- PRODUCT GRID SYSTEM --- */
        .container { max-width: 1440px; margin: 0 auto 120px; padding: 0 50px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 60px; }

        .card { 
            background: var(--dark-grey); 
            border: 1px solid var(--border); 
            padding: 35px; 
            text-align: center; 
            border-radius: var(--radius-lg); 
            transition: var(--transition-fluid); 
            position: relative;
        }
        .card:hover { 
            border-color: #555; 
            transform: translateY(-15px); 
            box-shadow: 0 40px 80px rgba(0,0,0,0.9); 
        }

        .img-container { 
            width: 100%; 
            aspect-ratio: 4/5; 
            overflow: hidden; 
            background: #000; 
            margin-bottom: 35px; 
            border-radius: var(--radius-sm); 
        }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 1s ease; }

        .dual-preview { display: flex; gap: 20px; aspect-ratio: 4/5; margin-bottom: 35px; }
        .dual-preview div { flex: 1; overflow: hidden; border-radius: var(--radius-sm); }
        .dual-preview img { width: 100%; height: 100%; object-fit: cover; }

        .card h3 { 
            font-family: 'Playfair Display', serif; 
            font-size: 1.5rem; 
            margin: 15px 0 5px; 
            color: #f8f8f8; 
            letter-spacing: 1px; 
        }
        .price-tag { 
            color: var(--gold); 
            font-size: 1.3rem; 
            margin-bottom: 30px; 
            display: block; 
            font-weight: 200; 
            font-family: 'Inter'; 
        }

        .action-btn { 
            background: transparent; 
            border: 1px solid #333; 
            color: #fff; 
            padding: 22px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 0.75rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            border-radius: var(--radius-sm); 
            transition: 0.4s; 
            font-weight: 600; 
        }
        .action-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }

        /* --- PRESTIGE MODAL --- */
        .overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.99); 
            z-index: 9999; 
            overflow-y: auto; 
            backdrop-filter: blur(20px); 
        }
        .modal { 
            position: relative; 
            margin: 80px auto; 
            background: var(--black); 
            padding: 80px 60px; 
            border: 1px solid var(--border); 
            width: 95%; 
            max-width: 1200px; 
            border-radius: var(--radius-lg); 
        }
        .close-modal { 
            position: absolute; 
            top: 40px; right: 40px; 
            color: #444; 
            cursor: pointer; 
            font-size: 2.5rem; 
            transition: 0.3s;
        }
        .close-modal:hover { color: var(--gold); }
        
        /* --- NARRATIVE TYPOGRAPHY --- */
        .narrative-text { 
            color: #e0e0e0; 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 1.5rem; 
            line-height: 1.9; 
            font-weight: 300;
            margin-bottom: 60px; 
            padding: 80px 60px; 
            background: #080808; 
            border-radius: var(--radius-sm); 
            border: 1px solid #151515;
            text-align: center; 
            font-style: italic;
            position: relative;
        }
        .narrative-text::before {
            content: "“";
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            font-size: 5rem;
            color: var(--gold);
            opacity: 0.2;
        }

        /* --- CHECKOUT FORM DESIGN --- */
        .checkout-form { display: flex; flex-direction: column; gap: 25px; }
        .checkout-form input, .checkout-form select, .checkout-form textarea { 
            width: 100%; 
            padding: 22px; 
            background: #000; 
            border: 1px solid #222; 
            color: white; 
            border-radius: var(--radius-sm); 
            font-size: 1rem; 
            font-family: 'Inter'; 
            transition: 0.3s;
        }
        .checkout-form input:focus { border-color: var(--gold); }

        .thumb-box { display: flex; gap: 20px; margin-top: 30px; justify-content: center; }
        .thumb-box img { 
            width: 85px; height: 110px; 
            object-fit: cover; 
            border: 1px solid #222; 
            border-radius: 6px; 
            cursor: pointer; 
            opacity: 0.4; 
            transition: 0.4s; 
        }
        .thumb-box img.active, .thumb-box img:hover { opacity: 1; border-color: var(--gold); transform: scale(1.05); }

        /* --- ADMIN INTERFACE --- */
        .admin-section { background: #0f0f0f; padding: 60px; margin-top: 50px; display: none; border: 1px dashed #444; border-radius: var(--radius-lg); }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
        .json-output { 
            background: #000; padding: 40px; color: #2ecc71; 
            font-size: 0.95rem; white-space: pre; overflow-x: auto; 
            margin-top: 50px; border-radius: var(--radius-sm); 
            font-family: 'Courier New', monospace; border: 1px solid #111;
        }

        /* --- ANIMATIONS --- */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card { animation: slideIn 0.8s ease-out forwards; }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
            .logo { font-size: 2.8rem; letter-spacing: 8px; }
            .modal { padding: 40px 20px; }
            .narrative-text { padding: 40px 20px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="initiateAdmin()">AURAVAULT</div>
        <nav>
            <span class="nav-link active" onclick="navigateVault('summaries.json', this)">SUMMARIES</span>
            <span class="nav-link" onclick="navigateVault('books.json', this)">BOOKS</span>
            <span class="nav-link" onclick="navigateVault('hoody.json', this)">HOODIES</span>
        </nav>
    </header>

    <div class="container">
        <div id="product-grid" class="grid"></div>

        <div id="admin-panel" style="display:none; margin-top: 150px; border-top: 1px solid #222; padding-top: 80px;">
            <h2 style="color:var(--gold); text-align:center; letter-spacing: 12px; margin-bottom: 60px; text-transform: uppercase; font-family: 'Playfair Display';">Vault Architect</h2>
            
            <div style="display: flex; gap: 30px; justify-content: center; margin-bottom: 60px; flex-wrap: wrap;">
                <button class="action-btn" style="width:auto; padding: 18px 50px;" onclick="switchAdminForm('summary')">ARCHIVE SUMMARY</button>
                <button class="action-btn" style="width:auto; padding: 18px 50px;" onclick="switchAdminForm('book')">ARCHIVE BOOK</button>
                <button class="action-btn" style="width:auto; padding: 18px 50px;" onclick="switchAdminForm('hoodie')">ARCHIVE HOODIE</button>
            </div>

            <div id="form-summary" class="admin-section">
                <input type="text" id="as-title" placeholder="Collection Archive Title">
                <textarea id="as-narrative" style="width:100%; height:160px; background:#000; color:#fff; padding:20px; margin-bottom:25px; border-radius:8px; border:1px solid #222;" placeholder="The Narrative (Luxury Content)..."></textarea>
                <div class="admin-grid">
                    <input type="text" id="as-book-img" placeholder="Book Surface URL">
                    <input type="text" id="as-book-price" placeholder="Book Unit Price">
                </div>
                <input type="text" id="as-source" placeholder="Supplier Source URL (Private Reference)" style="width:100%; margin-bottom:25px; padding:22px; background:#000; border:1px solid #222; color:var(--gold); border-radius:8px;">
                <div class="admin-grid">
                    <input type="text" id="as-h-front" placeholder="Hoodie Front URL">
                    <input type="text" id="as-h-back" placeholder="Hoodie Back URL">
                    <input type="text" id="as-h-sleeve" placeholder="Left Sleeve Detail URL">
                    <input type="text" id="as-fabric" placeholder="Material Composition">
                </div>
                <div class="admin-grid">
                    <input type="text" id="as-p-common" placeholder="Price (S, M, L)">
                    <input type="text" id="as-p-xl" placeholder="Price XL">
                    <input type="text" id="as-p-2xl" placeholder="Price 2XL">
                    <input type="text" id="as-p-3xl" placeholder="Price 3XL">
                </div>
                <button class="action-btn" onclick="executeGeneration('summary')" style="background:var(--gold); color:#000; border:none;">CONSTRUCT DATA OBJECT</button>
            </div>

            <div id="form-hoodie" class="admin-section">
                <input type="text" id="ah-title" placeholder="Aesthetic Hoodie Title">
                <div class="admin-grid"><input type="text" id="ah-front" placeholder="Front View"><input type="text" id="ah-back" placeholder="Back View"></div>
                <div class="admin-grid"><input type="text" id="ah-sleeve" placeholder="Sleeve Detail"><input type="text" id="ah-fabric" placeholder="Fabric Details"></div>
                <input type="text" id="ah-colors" placeholder="Color Palette (e.g., Onyx, Ghost White)">
                <input type="text" id="ah-source" placeholder="Supplier Source URL (Private Reference)" style="width:100%; margin-bottom:25px; padding:22px; background:#000; border:1px solid #222; color:var(--gold); border-radius:8px;">
                <div class="admin-grid">
                    <input type="text" id="ah-p-common" placeholder="Base Price (S-M-L)">
                    <input type="text" id="ah-p-xl" placeholder="XL Price">
                    <input type="text" id="ah-p-2xl" placeholder="2XL Price">
                    <input type="text" id="ah-p-3xl" placeholder="3XL Price">
                </div>
                <button class="action-btn" onclick="executeGeneration('hoodie')" style="background:var(--gold); color:#000; border:none;">CONSTRUCT DATA OBJECT</button>
            </div>

            <div id="form-book" class="admin-section">
                <input type="text" id="ab-title" placeholder="Archive Book Title">
                <div class="admin-grid"><input type="text" id="ab-price" placeholder="Price"><input type="text" id="ab-del" placeholder="Delivery Frame"></div>
                <input type="text" id="ab-img" placeholder="Cover Image URL">
                <input type="text" id="ab-source" placeholder="Supplier Source URL (Private Reference)" style="width:100%; margin-bottom:25px; padding:22px; background:#000; border:1px solid #222; color:var(--gold); border-radius:8px;">
                <button class="action-btn" onclick="executeGeneration('book')" style="background:var(--gold); color:#000; border:none;">CONSTRUCT DATA OBJECT</button>
            </div>
            
            <div id="json-output" class="json-output">// ARCHITECT STANDBY: DATA WILL APPEAR HERE...</div>
        </div>
    </div>

    <div id="main-modal" class="overlay" onclick="if(event.target == this) closeVaultModal()">
        <div class="modal">
            <span class="close-modal" onclick="closeVaultModal()">&times;</span>
            <h2 id="modal-title" style="font-family:'Playfair Display'; color:var(--gold); text-align:center; margin-bottom:50px; font-size:3rem; font-weight:400;"></h2>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        /* --- SYSTEM INITIALIZATION --- */
(function() { 
    emailjs.init("QWKaC8MCGOF9GwKvN"); 
    console.log("Vault Security Initialized...");
})();

let currentVaultFile = 'summaries.json';
let precisionPrices = {};

/* --- NAVIGATION CORE --- */
async function navigateVault(file, element) {
    currentVaultFile = file;
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    element.classList.add('active');
    await loadVaultArchive();
}

/* --- DATA FETCHING ENGINE --- */
async function loadVaultArchive() {
    const grid = document.getElementById('product-grid');
    grid.style.opacity = '0.5';
    try {
        const response = await fetch(currentVaultFile);
        const data = await response.json();
        grid.innerHTML = '';
        data.forEach((item, idx) => {
            const defaultImg = (item.backImageUrl && !item.summaryText) ? item.backImageUrl : (item.imageUrl || item.bookImg);
            const hoverImg = (item.imageUrl && item.backImageUrl && !item.summaryText) ? item.imageUrl : (item.backImageUrl || item.imageUrl || item.bookImg);
            const hoverScript = item.backImageUrl ? `onmouseover="this.src='${hoverImg}'" onmouseout="this.src='${defaultImg}'"` : '';
            const media = item.summaryText ? `<div class="dual-preview"><div><img src="${item.bookImg}"></div><div><img src="${item.imageUrl}"></div></div>` : `<div class="img-container"><img src="${defaultImg}" ${hoverScript}></div>`;
            grid.innerHTML += `<div class="card" style="animation-delay: ${idx * 0.1}s">${media}<h3>${item.title}</h3><div class="price-tag">$${item.price || item.bookPrice}</div><button class="action-btn" onclick='triggerVaultPreview(${JSON.stringify(item)})'>${item.summaryText ? 'Explore Archive' : 'Acquire Piece'}</button></div>`;
        });
        grid.style.opacity = '1';
    } catch (error) { grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:100px; color:#333;">ARCHIVE OFFLINE</div>`; }
}

/* --- PREVIEW LOGIC --- */
function triggerVaultPreview(item) {
    const modal = document.getElementById('main-modal');
    const content = document.getElementById('modal-content');
    document.getElementById('modal-title').innerText = item.title;
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden';

    if (item.summaryText) {
        content.innerHTML = `<div class="narrative-text">${item.summaryText}</div><div style="display:flex; gap:50px; flex-wrap:wrap;"><div style="flex:1; min-width:320px; background:#0d0d0d; padding:40px; border-radius:12px; border:1px solid #1a1a1a;"><img src="${item.bookImg}" style="width:100%; border-radius:8px; margin-bottom:30px;"><button class="action-btn" onclick="initiateCheckout('${item.title} (Book)', '${item.bookPrice}', false, '', null, '', '${item.bookImg}')">PURCHASE BOOK ($${item.bookPrice})</button></div><div style="flex:1; min-width:320px; background:#0d0d0d; padding:40px; border-radius:12px; border:1px solid #1a1a1a;"><img id="h-view" src="${item.imageUrl}" style="width:100%; border-radius:8px; margin-bottom:30px;"><div class="thumb-box"><img src="${item.imageUrl}" class="active" onclick="syncModalImage(this, '${item.imageUrl}')"><img src="${item.backImageUrl}" onclick="syncModalImage(this, '${item.backImageUrl}')">${item.sleeveImg ? `<img src="${item.sleeveImg}" onclick="syncModalImage(this, '${item.sleeveImg}')">` : ''}</div><button class="action-btn" onclick='initiateCheckout("${item.title} (Hoodie)", "${item.price}", true, "${item.colors}", ${JSON.stringify(item.prices)}, "${item.fabric}", "${item.imageUrl}", "${item.backImageUrl}", "${item.sleeveImg}")'>PURCHASE HOODIE ($${item.price})</button></div></div>`;
    } else {
        initiateCheckout(item.title, item.price || item.bookPrice, (currentVaultFile === 'hoody.json' || item.fabric), item.colors, item.prices, item.fabric, item.imageUrl, item.backImageUrl, item.sleeveImg);
    }
}

/* --- CHECKOUT ENGINE (CLEAN VERSION) --- */
function initiateCheckout(title, basePrice, isApparel, colors, priceMap, material, imgF, imgB, imgS) {
    window.activeOrderPrice = basePrice;
    precisionPrices = priceMap || { "S": basePrice, "M": basePrice, "L": basePrice, "XL": basePrice, "2XL": basePrice, "3XL": basePrice };
    const content = document.getElementById('modal-content');
    
    let visualHeader = isApparel ? `<div style="text-align:center; margin-bottom:50px;"><img id="chk-view" src="${imgF}" style="max-height:300px; border-radius:12px; border:1px solid #222; margin-bottom:25px;"><div class="thumb-box" style="margin-top:0"><img src="${imgF}" class="active" onclick="syncModalImage(this, '${imgF}')" style="width:60px; height:75px;"><img src="${imgB}" onclick="syncModalImage(this, '${imgB}')" style="width:60px; height:75px;">${imgS ? `<img src="${imgS}" onclick="syncModalImage(this, '${imgS}')" style="width:60px; height:75px;">` : ''}</div></div>` : `<div style="text-align:center; margin-bottom:50px;"><img src="${imgF}" style="max-height:300px; border-radius:12px; border:1px solid #222;"></div>`;

    let apparelFields = isApparel ? `<div class="admin-grid"><select id="size-selector" onchange="adjustPrice(this)"><option value="">SELECT SIZE</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="2XL">2XL</option><option value="3XL">3XL</option></select><select id="color-selector"><option value="">SELECT COLOR</option>${(colors || "Original").split(',').map(c => `<option>${c.trim()}</option>`).join('')}</select></div>` : '';

    content.innerHTML = `${visualHeader}<div class="checkout-form"><h3 id="live-price" style="text-align:center; color:var(--gold); font-size:3rem; margin-bottom:30px;">$${basePrice}</h3><input id="c-name" placeholder="Full Legal Name"><div class="admin-grid"><input id="c-phone" placeholder="Mobile Contact" type="tel"><input id="c-email" placeholder="Electronic Mail" type="email"></div>${apparelFields}<input id="c-country" placeholder="Destination Country"><div class="admin-grid"><input id="c-city" placeholder="City"><input id="c-zip" placeholder="ZIP Code"></div><textarea id="c-address" placeholder="Full Detailed Shipping Address" rows="4"></textarea><button class="action-btn" id="vault-confirm" onclick="finalizeVaultOrder('${title}')" style="background:var(--gold); color:black;">CONFIRM RESERVATION</button></div>`;
}

/* --- FINAL TRANSMISSION (FIXED) --- */
function finalizeVaultOrder(itemTitle) {
    const btn = document.getElementById('vault-confirm');
    const inputs = ['c-name', 'c-phone', 'c-address', 'c-country', 'c-email', 'c-city', 'c-zip'];
    let fail = false;
    
    inputs.forEach(id => {
        const el = document.getElementById(id);
        if(!el || !el.value) { if(el) el.style.borderColor = 'red'; fail = true; }
        else { el.style.borderColor = '#222'; }
    });

    if(fail) return alert("Please complete all prestige fields.");

    const payload = {
        order_id: "AV-" + Math.floor(Math.random() * 900000 + 100000),
        customer_name: document.getElementById('c-name').value,
        customer_phone: document.getElementById('c-phone').value,
        customer_email: document.getElementById('c-email').value,
        customer_country: document.getElementById('c-country').value,
        customer_city: document.getElementById('c-city').value,
        customer_zip: document.getElementById('c-zip').value,
        customer_address: document.getElementById('c-address').value,
        item_title: itemTitle,
        item_price: window.activeOrderPrice,
        item_size: document.getElementById('size-selector')?.value || 'Unique',
        item_color: document.getElementById('color-selector')?.value || 'Default'
    };

    btn.innerText = "TRANSMITTING TO VAULT...";
    btn.disabled = true;

    emailjs.send("service_9yrz8kd", "template_1lgifb3", payload)
        .then(() => { alert("Reservation Successful! ID: " + payload.order_id); closeVaultModal(); })
        .catch((err) => { alert("Vault Error. Try again."); btn.disabled = false; btn.innerText = "RETRY"; });
}

/* --- HELPERS & ADMIN --- */
function syncModalImage(el, src) {
    const mImg = document.getElementById('h-view') || document.getElementById('chk-view');
    if(mImg) mImg.src = src;
    el.parentElement.querySelectorAll('img').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
}
function adjustPrice(select) {
    if(select.value) {
        const p = precisionPrices[select.value] || window.activeOrderPrice;
        document.getElementById('live-price').innerText = "$" + p;
        window.activeOrderPrice = p;
    }
}
function closeVaultModal() { document.getElementById('main-modal').style.display = 'none'; document.body.style.overflow = 'auto'; }
function initiateAdmin() { if(prompt("Vault Security Key:") === "canon_-!LB2107") { document.getElementById('admin-panel').style.display = 'block'; } }
function switchAdminForm(t) { document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none'); document.getElementById('form-' + t).style.display = 'block'; }
function executeGeneration(type) {
    let data = {};
    const output = document.getElementById('json-output');
    
    try {
        if(type === 'summary') {
            data = {
                title: document.getElementById('as-title').value,
                summaryText: document.getElementById('as-narrative').value,
                bookImg: document.getElementById('as-book-img').value,
                bookPrice: document.getElementById('as-book-price').value,
                imageUrl: document.getElementById('as-h-front').value,
                backImageUrl: document.getElementById('as-h-back').value,
                sleeveImg: document.getElementById('as-h-sleeve').value,
                fabric: document.getElementById('as-fabric').value,
                price: document.getElementById('as-p-common').value,
                prices: {
                    "S": document.getElementById('as-p-common').value,
                    "M": document.getElementById('as-p-common').value,
                    "L": document.getElementById('as-p-common').value,
                    "XL": document.getElementById('as-p-xl').value,
                    "2XL": document.getElementById('as-p-2xl').value,
                    "3XL": document.getElementById('as-p-3xl').value
                }
            };
        } else if(type === 'hoodie') {
            data = {
                title: document.getElementById('ah-title').value,
                imageUrl: document.getElementById('ah-front').value,
                backImageUrl: document.getElementById('ah-back').value,
                sleeveImg: document.getElementById('ah-sleeve').value,
                fabric: document.getElementById('ah-fabric').value,
                colors: document.getElementById('ah-colors').value,
                price: document.getElementById('ah-p-common').value,
                prices: {
                    "S": document.getElementById('ah-p-common').value,
                    "M": document.getElementById('ah-p-common').value,
                    "L": document.getElementById('ah-p-common').value,
                    "XL": document.getElementById('ah-p-xl').value,
                    "2XL": document.getElementById('ah-p-2xl').value,
                    "3XL": document.getElementById('ah-p-3xl').value
                }
            };
        } else if(type === 'book') {
            data = {
                title: document.getElementById('ab-title').value,
                bookPrice: document.getElementById('ab-price').value,
                imageUrl: document.getElementById('ab-img').value,
                deliveryFrame: document.getElementById('ab-del').value
            };
        }

        // تحويل البيانات لنص JSON وعرضها في الخانة الخضراء
        output.innerText = JSON.stringify(data, null, 4) + ",";
        output.style.color = "#2ecc71"; // يرجع اللون أخضر
        
        // Scroll لأسفل باش تشوف الكود
        output.scrollIntoView({ behavior: 'smooth' });

    } catch (err) {
        output.innerText = "ERROR: " + err.message;
        output.style.color = "red";
    }
}
    </script>
</body>
</html>
