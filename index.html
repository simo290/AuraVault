<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraVault | Luxury Pack System</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --bg: #0a0a0a;
            --card: #121212;
            --text: #ffffff;
            --border: #262626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

        /* Banner */
        .shipping-banner {
            background: var(--gold); color: black; text-align: center;
            padding: 10px; font-size: 0.7rem; font-weight: 800; letter-spacing: 2px;
            position: sticky; top: 0; z-index: 1000; text-transform: uppercase;
        }

        header { padding: 40px 20px; text-align: center; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--gold); letter-spacing: 10px; }

        /* Grid */
        .container { max-width: 1300px; margin: 0 auto; padding: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }

        /* Card */
        .card { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 12px; padding: 20px; text-align: center; transition: 0.4s;
        }
        .img-box { 
            position: relative; width: 100%; aspect-ratio: 4/5; 
            overflow: hidden; border-radius: 8px; margin-bottom: 15px;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s ease; }
        .img-back { position: absolute; top: 0; left: 0; opacity: 0; }
        .card:hover .img-front { opacity: 0; }
        .card:hover .img-back { opacity: 1; }

        .price-tag { color: var(--gold); font-size: 1.4rem; font-weight: bold; margin: 10px 0; }

        /* --- Buttons System --- */
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }

        .btn-order { 
            background: transparent; border: 1px solid var(--gold); color: var(--gold); 
            padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; 
            text-transform: uppercase; font-size: 0.75rem; transition: 0.3s;
        }
        .btn-order:hover { background: rgba(212, 175, 55, 0.1); }

        /* زر الـ Pack المتميز */
        .btn-pack { 
            background: var(--gold); color: black; border: none;
            padding: 15px; border-radius: 6px; cursor: pointer; font-weight: 800;
            text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .btn-pack:hover { transform: scale(1.02); background: #e5bd3d; }

        .badge-pack {
            background: #ff3e3e; color: white; font-size: 0.6rem; padding: 3px 8px;
            border-radius: 20px; position: absolute; top: 15px; right: 15px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="shipping-banner">🇺🇸 FREE SHIPPING ONLY WITHIN THE UNITED STATES 🇺🇸</div>

    <header>
        <div class="logo">AURAVAULT</div>
    </header>

    <div class="container">
        <div id="product-grid" class="grid">
            </div>
    </div>

    <script>
        // دالة عرض المنتجات
        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            
            // مثال لبيانات المنتج (هادي هي اللي غاتكون فـ JSON)
            const products = [
                {
                    title: "Essential Archive Look",
                    imgF: "front_hoodie.jpg",
                    imgB: "back_hoodie.jpg",
                    price_single: "45.00",
                    price_pack: "89.99", // ثمن الباك (فوقية + سروال + كاسكيط)
                    colors: "Classic Black, Silver"
                }
            ];

            products.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="img-box">
                            <span class="badge-pack">BEST VALUE</span>
                            <img src="${item.imgF}" class="img-front">
                            <img src="${item.imgB}" class="img-back">
                        </div>
                        <h3>${item.title}</h3>
                        <p class="price-tag">$${item.price_single}</p>
                        
                        <div class="btn-group">
                            <button class="btn-order" onclick='buyItem(${JSON.stringify(item)}, "Single")'>
                                Buy Hoodie Only
                            </button>

                            <button class="btn-pack" onclick='buyItem(${JSON.stringify(item)}, "Full Pack")'>
                                📦 GET THE FULL PACK ($${item.price_pack})
                                <br><span style="font-size:0.6rem; font-weight:normal;">(Hoodie + Pants + Beanie)</span>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function buyItem(product, type) {
            // كنزيدو نوع الطلب (باك ولا قطعة) باش يوصلك فـ الإيميل
            const orderData = { ...product, orderType: type };
            localStorage.setItem('selectedProduct', JSON.stringify(orderData));
            window.location.href = 'checkout.html';
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
