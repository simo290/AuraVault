<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA VAULT | THE ARCHIVE SYSTEM</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@100;300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --bg-black: #050505;
            --card-surface: #0f0f0f;
            --border-dim: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --transition-fluid: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { background-color: var(--bg-black); color: var(--text-primary); font-family: 'Inter', sans-serif; line-height: 1.6; overflow-x: hidden; }

        /* [ANNOUNCEMENT] */
        .shipping-announcement {
            background: var(--gold); color: #000; text-align: center;
            padding: 14px; font-size: 0.7rem; font-weight: 900;
            letter-spacing: 4px; text-transform: uppercase;
            position: sticky; top: 0; z-index: 9000;
        }

        /* [HEADER] */
        header { padding: 100px 20px 50px; text-align: center; border-bottom: 1px solid var(--border-dim); }
        .brand-logo {
            font-family: 'Playfair Display', serif; font-size: 3.5rem;
            color: var(--gold); letter-spacing: 15px; text-transform: uppercase;
            font-weight: 900; cursor: pointer; transition: var(--transition-fluid);
        }

        .nav-container { display: flex; justify-content: center; gap: 30px; margin-top: 50px; flex-wrap: wrap; }
        .nav-item {
            color: var(--text-secondary); text-transform: uppercase;
            font-size: 0.65rem; letter-spacing: 3px; font-weight: 700;
            cursor: pointer; padding: 12px 20px; transition: var(--transition-fluid);
        }
        .nav-item.active { color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; }

        /* [GRID] */
        .content-wrapper { max-width: 1400px; margin: 0 auto; padding: 60px 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; }
        
        .archive-card {
            background: var(--card-surface); border: 1px solid var(--border-dim);
            padding: 25px; border-radius: 4px; transition: var(--transition-fluid);
            position: relative; animation: fadeUp 1s ease;
        }
        .archive-card:hover { border-color: var(--gold); transform: translateY(-10px); }

        .media-portal { position: relative; width: 100%; aspect-ratio: 1/1.3; overflow: hidden; margin-bottom: 25px; background: #000; }
        .media-portal img { width: 100%; height: 100%; object-fit: cover; transition: 1.5s ease; }
        .img-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: 0.8s ease; }
        .archive-card:hover .img-overlay { opacity: 1; }

        .card-price { color: var(--gold); font-weight: 900; font-size: 1.6rem; margin-bottom: 20px; }

        /* [BUTTONS] */
        .btn-vault {
            width: 100%; padding: 18px; border-radius: 2px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            transition: 0.3s; border: 1px solid var(--gold); background: transparent; color: var(--gold);
        }
        .btn-vault:hover { background: var(--gold); color: #000; }
        .btn-close { background: #1a1a1a; border-color: #333; color: #fff; margin-top: 15px; }

        /* [CHECKOUT] */
        .view { display: none; }
        .view.active { display: block; }
        .checkout-container { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 40px; max-width: 1200px; margin: 40px auto; padding: 20px; }
        .logistics-panel { background: var(--card-surface); padding: 40px; border-radius: 8px; border: 1px solid var(--border-dim); }
        .input-box { margin-bottom: 20px; }
        .input-box label { display: block; font-size: 0.6rem; text-transform: uppercase; color: #555; margin-bottom: 8px; }
        input, select, textarea { width: 100%; background: #000; border: 1px solid #222; padding: 15px; color: #fff; border-radius: 4px; }
        
        .summary-panel {
            background: #000; padding: 30px; border: 1px solid var(--gold);
            height: fit-content; position: sticky; top: 120px;
        }

        /* [ADMIN DASHBOARD] */
        .admin-dashboard { max-width: 900px; margin: 50px auto; padding: 40px; }
        .admin-box { background: #0a0a0a; padding: 30px; border: 1px solid #222; margin-bottom: 30px; }
        
        /* [WHATSAPP] */
        .whatsapp-fixed {
            position: fixed; bottom: 30px; right: 30px; background: #25d366;
            width: 60px; height: 60px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; z-index: 9999;
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="shipping-announcement">🇺🇸 SHIPPING AVAILABLE WITHIN THE UNITED STATES ONLY 🇺🇸</div>

    <section id="view-shop" class="view active">
        <header>
            <div class="brand-logo" onclick="location.reload()">AURA VAULT</div>
            <nav class="nav-container" id="main-nav"></nav>
        </header>
        <div class="content-wrapper">
            <div id="product-grid" class="product-grid"></div>
        </div>
        <footer style="padding: 100px; text-align: center; opacity: 0.2;">
            <p onclick="app.authAdmin()" style="cursor:pointer; font-size:0.6rem; letter-spacing:5px;">VAULT ACCESS UNIT</p>
        </footer>
    </section>

    <section id="view-checkout" class="view">
        <header><div class="brand-logo" onclick="app.navigate('view-shop')">AURA VAULT</div></header>
        <div class="checkout-container">
            <div class="logistics-panel">
                <h2 style="color:var(--gold); margin-bottom:30px; font-family:'Playfair Display';">Reservation Details</h2>
                <div class="input-box"><label>Full Name</label><input type="text" id="in-name"></div>
                <div class="input-box"><label>Shipping Address (USA)</label><input type="text" id="in-addr"></div>
                <div style="display:flex; gap:15px">
                    <input type="text" id="in-city" placeholder="City">
                    <input type="text" id="in-zip" placeholder="ZIP Code">
                </div>
                <div class="input-box" style="margin-top:20px"><label>Phone Number</label><input type="tel" id="in-phone"></div>
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; border-top:1px solid #222; padding-top:25px; margin-top:25px">
                    <div class="input-box"><label>Archive Size</label><select id="in-size" onchange="app.refreshTotal()"></select></div>
                    <div class="input-box"><label>Archive Color</label><select id="in-color"></select></div>
                </div>
                <button class="btn-vault" style="margin-top:20px" onclick="app.executeOrder()">Finalize Reservation</button>
                <div id="display-reviews" style="margin-top:40px"></div>
            </div>

            <div class="summary-panel">
                <h3 id="sum-title" style="margin-bottom:10px">Article</h3>
                <div style="display:flex; justify-content:space-between; margin-bottom:15px">
                    <span>Quantity:</span>
                    <input type="number" id="in-qty" value="1" min="1" onchange="app.refreshTotal()" style="width:50px; padding:2px; background:none; border:1px solid #333; color:white">
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.8rem">
                    <span>Shipping:</span><span style="color:var(--accent-green)">FREE (USA)</span>
                </div>
                <div style="margin-top:30px; border-top:1px solid var(--gold); padding-top:20px; display:flex; justify-content:space-between; font-size:1.8rem; font-weight:900; color:var(--gold)">
                    <span>TOTAL:</span><span id="sum-total">$0.00</span>
                </div>
            </div>
        </div>
    </section>

    <section id="view-admin" class="view">
        <header><h1 style="color:var(--gold); letter-spacing:10px; text-align:center">VAULT COMMAND</h1></header>
        <div class="admin-dashboard">
            <div class="admin-box">
                <h3 style="color:var(--gold); margin-bottom:20px">INDUCT NEW ARTICLE</h3>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px">
                    <div class="input-box">
                        <label>Category</label>
                        <select id="adm-cat">
                            <option value="hoody.json">HOODIES</option>
                            <option value="tshirts.json">T-SHIRTS</option>
                            <option value="packs.json">PACKS</option>
                            <option value="pants.json">PANTS</option>
                        </select>
                    </div>
                    <div class="input-box"><label>Title</label><input type="text" id="adm-title" placeholder="e.g. AURA HOODIE"></div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px">
                    <div class="input-box"><label>Front Image URL</label><input type="text" id="adm-imgf"></div>
                    <div class="input-box"><label>Back Image URL</label><input type="text" id="adm-imgb"></div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:15px">
                    <div class="input-box"><label>Price (Std)</label><input type="text" id="adm-p-std"></div>
                    <div class="input-box"><label>Price (XL)</label><input type="text" id="adm-p-xl"></div>
                    <div class="input-box"><label>Colors (Split by ,)</label><input type="text" id="adm-cols" placeholder="Black, Red"></div>
                </div>
                <button class="btn-vault" onclick="app.adminAddProduct()">Deploy Article</button>
            </div>

            <div class="admin-box">
                <h3 style="color:var(--gold); margin-bottom:20px">INJECT TESTIMONIAL</h3>
                <input type="text" id="adm-rev-user" placeholder="User Name" style="margin-bottom:10px">
                <input type="text" id="adm-rev-prod" placeholder="Target Product Title" style="margin-bottom:10px">
                <textarea id="adm-rev-text" placeholder="Comment content..." style="margin-bottom:10px"></textarea>
                <button class="btn-vault" onclick="app.adminInjectReview()">Inject Review</button>
            </div>

            <button class="btn-vault btn-close" onclick="app.navigate('view-shop')">CLOSE COMMAND CENTER</button>
        </div>
    </section>

    <a href="https://wa.me/212717948663" class="whatsapp-fixed">
        <svg style="width:30px;height:30px" viewBox="0 0 24 24"><path fill="#fff" d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42 1.56 1.56 2.41 3.63 2.41 5.83 0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.19-.3a8.132 8.132 0 0 1-1.26-4.38c.01-4.54 3.7-8.24 8.24-8.24m-3.53 3.03c-.19 0-.43.07-.66.33-.23.25-.87.86-.87 2.1s.9 2.44 1.03 2.61c.13.17 1.76 2.68 4.26 3.76.59.26 1.05.41 1.41.53.6.19 1.15.16 1.58.1.48-.07 1.48-.6 1.69-1.19.21-.58.21-1.09.14-1.19-.07-.1-.24-.17-.51-.3s-1.59-.78-1.84-.87-.43-.13-.6.13c-.17.26-.66.86-.81 1.03-.14.17-.29.19-.56.06-.26-.13-1.11-.41-2.11-1.31-.78-.69-1.3-1.55-1.45-1.81-.15-.26-.02-.4.12-.53.12-.11.26-.31.4-.46.13-.15.17-.26.26-.43.09-.17.04-.32-.02-.45-.06-.13-.6-1.45-.82-1.99-.21-.52-.43-.45-.6-.45z"/></svg>
    </a>

    <script>
        const app = {
            state: {
                cats: ['packs.json', 'hoody.json', 'tshirts.json', 'pants.json'],
                activeProd: null
            },

            init: function() {
                emailjs.init("QWKaC8MCGOF9GwKvN");
                this.renderNav();
                this.fetchArchive('packs.json');
            },

            renderNav: function() {
                const nav = document.getElementById('main-nav');
                this.state.cats.forEach((c, i) => {
                    const item = document.createElement('div');
                    item.className = `nav-item ${i===0?'active':''}`;
                    item.innerText = c.split('.')[0].toUpperCase();
                    item.onclick = (e) => {
                        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                        e.target.classList.add('active');
                        this.fetchArchive(c);
                    };
                    nav.appendChild(item);
                });
            },

            fetchArchive: async function(file) {
                const grid = document.getElementById('product-grid');
                grid.innerHTML = '<p>Accessing Node...</p>';
                try {
                    const res = await fetch(file);
                    let data = await res.json();
                    
                    // Add Admin-added items from LocalStorage
                    const localData = JSON.parse(localStorage.getItem('vault_local_' + file) || '[]');
                    const combined = [...data, ...localData];
                    
                    grid.innerHTML = '';
                    combined.forEach(prod => {
                        const card = document.createElement('div');
                        card.className = 'archive-card';
                        card.innerHTML = `
                            <div class="media-portal">
                                <img src="${prod.imgF}">
                                <div class="img-overlay"><img src="${prod.imgB || prod.imgF}"></div>
                            </div>
                            <div class="card-meta">
                                <h3>${prod.title}</h3>
                                <div class="card-price">$${prod.price_pack || prod.p_std}</div>
                                <button class="btn-vault" onclick='app.goCheckout(${JSON.stringify(prod)})'>Acquire Now</button>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } catch(e) { grid.innerHTML = '<p>Error loading archive.</p>'; }
            },

            goCheckout: function(prod) {
                this.state.activeProd = prod;
                document.getElementById('sum-title').innerText = prod.title;
                
                const sz = document.getElementById('in-size'); sz.innerHTML = '';
                if(prod.price_pack) {
                    sz.innerHTML = `<option value="${prod.price_pack}">Full Pack Bundle</option>`;
                } else {
                    const opts = [{l:'S', p:prod.p_std}, {l:'M', p:prod.p_std}, {l:'L', p:prod.p_std}, {l:'XL', p:prod.p_xl || prod.p_std}];
                    opts.forEach(o => sz.innerHTML += `<option value="${o.p}">${o.l}</option>`);
                }

                const col = document.getElementById('in-color'); col.innerHTML = '';
                prod.colors.split(',').forEach(c => col.innerHTML += `<option value="${c.trim()}">${c.trim()}</option>`);

                this.renderReviews(prod.title);
                this.refreshTotal();
                this.navigate('view-checkout');
            },

            refreshTotal: function() {
                const price = parseFloat(document.getElementById('in-size').value) || 0;
                const qty = parseInt(document.getElementById('in-qty').value) || 1;
                const total = (price * qty).toFixed(2);
                document.getElementById('sum-total').innerText = "$" + total;
            },

            navigate: function(id) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                window.scrollTo(0,0);
            },

            renderReviews: function(title) {
                const box = document.getElementById('display-reviews');
                const revs = JSON.parse(localStorage.getItem('vault_revs') || '[]');
                const filtered = revs.filter(r => r.prod === title);
                box.innerHTML = filtered.length ? filtered.map(r => `
                    <div style="background:#0a0a0a; padding:15px; border-left:2px solid var(--gold); margin-bottom:10px">
                        <p style="color:var(--gold); font-size:0.7rem; font-weight:800">${r.user}</p>
                        <p style="color:#888; font-size:0.8rem">${r.text}</p>
                    </div>
                `).join('') : '<p style="font-size:0.6rem; color:#333">ARCHIVE QUALITY CERTIFIED</p>';
            },

            /** ADMIN COMMANDS **/
            authAdmin: function() {
                const p = prompt("ACCESS KEY:");
                if(p === "canon_-!LB2107") this.navigate('view-admin');
            },

            adminAddProduct: function() {
                const cat = document.getElementById('adm-cat').value;
                const newItem = {
                    title: document.getElementById('adm-title').value,
                    imgF: document.getElementById('adm-imgf').value,
                    imgB: document.getElementById('adm-imgb').value,
                    p_std: document.getElementById('adm-p-std').value,
                    p_xl: document.getElementById('adm-p-xl').value,
                    colors: document.getElementById('adm-cols').value,
                    price_pack: cat === 'packs.json' ? document.getElementById('adm-p-std').value : null
                };
                if(!newItem.title || !newItem.imgF) return alert("Fill essential data!");
                const localData = JSON.parse(localStorage.getItem('vault_local_' + cat) || '[]');
                localData.push(newItem);
                localStorage.setItem('vault_local_' + cat, JSON.stringify(localData));
                alert("ARTICLE DEPLOYED!"); location.reload();
            },

            adminInjectReview: function() {
                const u = document.getElementById('adm-rev-user').value;
                const p = document.getElementById('adm-rev-prod').value;
                const t = document.getElementById('adm-rev-text').value;
                if(!u || !p || !t) return;
                const revs = JSON.parse(localStorage.getItem('vault_revs') || '[]');
                revs.push({ user: u, prod: p, text: t });
                localStorage.setItem('vault_revs', JSON.stringify(revs));
                alert("REVIEW INJECTED!");
            },

            executeOrder: function() {
                const btn = document.querySelector('.btn-vault');
                btn.innerText = "TRANSMITTING...";
                const payload = {
                    customer: document.getElementById('in-name').value,
                    product: this.state.activeProd.title,
                    location: document.getElementById('in-addr').value + ", " + document.getElementById('in-city').value,
                    phone: document.getElementById('in-phone').value,
                    config: document.getElementById('in-size').options[document.getElementById('in-size').selectedIndex].text + " / " + document.getElementById('in-color').value,
                    total: document.getElementById('sum-total').innerText
                };
                emailjs.send("service_9yrz8kd", "template_1lgifb3", payload).then(() => {
                    alert("CONSIGNMENT RECEIVED"); location.reload();
                });
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
