<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AuraVault | Secure Admin Panel</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --card: #1a1a1a; --text: #eee; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 40px; }
        .login-screen { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .admin-container { max-width: 900px; margin: 0 auto; display: none; }
        
        .section-card { background: var(--card); padding: 30px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #333; }
        h2 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #333; pb: 10px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; }
        
        .price-group { border: 1px solid #333; padding: 15px; border-radius: 8px; grid-column: span 2; background: #111; }
        .price-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        
        .generate-btn { background: var(--gold); color: #000; border: none; padding: 15px 30px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
        .output-area { background: #000; color: #0f0; padding: 20px; border-radius: 8px; margin-top: 20px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; display: none; border: 1px solid #0f0; }
        .copy-btn { background: #333; color: #fff; border: none; padding: 5px 10px; cursor: pointer; font-size: 0.7rem; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="login" class="login-screen">
        <div style="text-align: center;">
            <h1 style="color: var(--gold); margin-bottom: 20px;">ACCESS VAULT</h1>
            <input type="password" id="passInput" placeholder="Enter Admin Key" style="width: 250px; text-align: center;">
            <br><br>
            <button class="generate-btn" onclick="checkPass()" style="width: 150px;">Unlock</button>
        </div>
    </div>

    <div id="adminPanel" class="admin-container">
        <h1>CONTROL CENTER</h1>

        <div class="section-card">
            <h2>Part 1: Tops (Archive)</h2>
            <div class="form-grid" id="form-tops">
                <div><label>Front Image URL</label><input type="text" class="imgF"></div>
                <div><label>Back Image URL</label><input type="text" class="imgB"></div>
                <div><label>Product Title</label><input type="text" class="title"></div>
                <div><label>Fabric Type (Cloth)</label><input type="text" class="cloth"></div>
                <div><label>Delivery Time</label><input type="text" class="time" value="2-4 Business Days"></div>
                <div><label>Colors (Comma separated)</label><input type="text" class="colors" placeholder="Black, White, Grey"></div>
                <div><label>Stock (Quantity)</label><input type="number" class="stock" value="100"></div>
                <div class="price-group">
                    <label>Size-Based Pricing ($)</label>
                    <div class="price-grid">
                        <div><label>S/M/L</label><input type="text" class="p_std" placeholder="32.90"></div>
                        <div><label>XL</label><input type="text" class="p_xl" placeholder="34.90"></div>
                        <div><label>2XL</label><input type="text" class="p_2xl" placeholder="36.90"></div>
                        <div><label>3XL</label><input type="text" class="p_3xl" placeholder="38.90"></div>
                    </div>
                </div>
            </div>
            <button class="generate-btn" onclick="generateJSON('tops')">Generate Code for Tops</button>
        </div>

        <div class="section-card">
            <h2>Part 2: Pants</h2>
            <div class="form-grid" id="form-pants">
                <div><label>Front Image URL</label><input type="text" class="imgF"></div>
                <div><label>Back Image URL</label><input type="text" class="imgB"></div>
                <div><label>Title</label><input type="text" class="title"></div>
                <div><label>Fabric Type</label><input type="text" class="cloth"></div>
                <div><label>Delivery Time</label><input type="text" class="time"></div>
                <div><label>Colors</label><input type="text" class="colors"></div>
                <div><label>Stock</label><input type="number" class="stock"></div>
                <div class="price-group">
                    <div class="price-grid">
                        <div><label>S/M/L</label><input type="text" class="p_std"></div>
                        <div><label>XL</label><input type="text" class="p_xl"></div>
                        <div><label>2XL</label><input type="text" class="p_2xl"></div>
                        <div><label>3XL</label><input type="text" class="p_3xl"></div>
                    </div>
                </div>
            </div>
            <button class="generate-btn" onclick="generateJSON('pants')">Generate Code for Pants</button>
        </div>

        <div class="section-card">
            <h2>Part 3: Caps & Beanies</h2>
            <div class="form-grid" id="form-caps">
                <div><label>Image URL</label><input type="text" class="imgF"></div>
                <div><label>Title</label><input type="text" class="title"></div>
                <div><label>Colors</label><input type="text" class="colors"></div>
                <div><label>Delivery Time</label><input type="text" class="time"></div>
                <div><label>Price ($)</label><input type="text" class="p_std"></div>
                <div><label>Stock</label><input type="number" class="stock"></div>
                <div><label>Size</label><input type="text" readonly value="One Size"></div>
            </div>
            <button class="generate-btn" onclick="generateJSON('caps')">Generate Code for Caps</button>
        </div>

        <div class="section-card">
            <h2>Part 4: The Ultimate Pack</h2>
            <div class="form-grid" id="form-pack">
                <div style="grid-column: span 2;"><label>Main Display Image (Banner Image)</label><input type="text" class="imgMain"></div>
                <div><label>Pack Title</label><input type="text" class="title"></div>
                <div><label>Delivery Time</label><input type="text" class="time"></div>
                <div><label>Total Pack Price ($)</label><input type="text" class="price_pack"></div>
                <div><label>Stock</label><input type="number" class="stock"></div>
                
                <div class="price-group">
                    <label>Pack Components Images</label>
                    <div class="form-grid" style="margin-top:5px;">
                        <input type="text" class="imgPants" placeholder="Pants Image URL">
                        <input type="text" class="imgTop" placeholder="Hoodie/T-shirt Image URL">
                        <input type="text" class="imgCap" placeholder="Cap/Beanie Image URL">
                        <input type="text" class="colors" placeholder="Available Colors in Pack">
                    </div>
                </div>
            </div>
            <button class="generate-btn" onclick="generateJSON('pack')">Generate Code for Packs</button>
        </div>

        <div id="resultBox" class="output-area">
            <button class="copy-btn" onclick="copyCode()">Copy Code</button>
            <div id="jsonCode"></div>
        </div>
    </div>

    <script>
        function checkPass() {
            const pass = document.getElementById('passInput').value;
            if(pass === 'canon_-!LB2107') {
                document.getElementById('login').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else { alert('Wrong Key!'); }
        }

        function generateJSON(type) {
            let data = {};
            const section = document.getElementById('form-' + type);
            
            if(type === 'pack') {
                data = {
                    title: section.querySelector('.title').value,
                    imgF: section.querySelector('.imgMain').value,
                    imgPants: section.querySelector('.imgPants').value,
                    imgTop: section.querySelector('.imgTop').value,
                    imgCap: section.querySelector('.imgCap').value,
                    price_pack: section.querySelector('.price_pack').value,
                    time: section.querySelector('.time').value,
                    colors: section.querySelector('.colors').value,
                    stock: section.querySelector('.stock').value
                };
            } else {
                data = {
                    title: section.querySelector('.title').value,
                    imgF: section.querySelector('.imgF').value,
                    imgB: section.querySelector('.imgB') ? section.querySelector('.imgB').value : "",
                    cloth: section.querySelector('.cloth') ? section.querySelector('.cloth').value : "Standard",
                    time: section.querySelector('.time').value,
                    colors: section.querySelector('.colors').value,
                    stock: section.querySelector('.stock').value,
                    p_std: section.querySelector('.p_std').value,
                    p_xl: section.querySelector('.p_xl') ? section.querySelector('.p_xl').value : "",
                    p_2xl: section.querySelector('.p_2xl') ? section.querySelector('.p_2xl').value : "",
                    p_3xl: section.querySelector('.p_3xl') ? section.querySelector('.p_3xl').value : ""
                };
            }

            const resultBox = document.getElementById('resultBox');
            const jsonCode = document.getElementById('jsonCode');
            
            // Generate as an array element
            jsonCode.innerText = JSON.stringify([data], null, 4);
            resultBox.style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }

        function copyCode() {
            const text = document.getElementById('jsonCode').innerText;
            navigator.clipboard.writeText(text);
            alert('Code Copied! Paste it in your .json file');
        }
    </script>
</body>
</html>
