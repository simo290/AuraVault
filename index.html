<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraVault | Luxury Archive</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --black: #0a0a0a; --dark-grey: #1a1a1a; --green: #2ecc71; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--black); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        header { padding: 40px 20px; text-align: center; border-bottom: 1px solid #333; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--gold); letter-spacing: 2px; cursor: pointer; transition: 0.5s; }
        .logo:hover { text-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }
        nav { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .nav-link { color: #888; text-decoration: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; padding-bottom: 5px; transition: 0.3s; }
        .nav-link.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { background: var(--dark-grey); padding: 20px; border-radius: 5px; text-align: center; border: 1px solid #222; position: relative; transition: 0.3s; }
        .card:hover { border-color: var(--gold); }
        
        /* New Styles for Uniform Dimensions */
        .img-container { width: 100%; aspect-ratio: 3/4; overflow: hidden; border-radius: 3px; background: #000; display: flex; align-items: center; justify-content: center; }
        .card img { width: 100%; height: 100%; object-fit: contain; transition: 0.5s ease; }
        .dual-preview { display: flex; gap: 8px; aspect-ratio: 3/4; width: 100%; margin-bottom: 10px; }
        .dual-preview div { flex: 1; background: #000; overflow: hidden; border: 1px solid #333; }
        .dual-preview img { width: 100%; height: 100%; object-fit: cover; }
        .delivery-tag { font-size: 0.7rem; color: #888; margin-top: 5px; display: block; letter-spacing: 1px; }
        
        .action-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 12px 25px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .action-btn:hover { background: var(--gold); color: black; }
        
        /* Gallery Thumbnails */
        .thumb-box { display: flex; gap: 8px; margin-top: 15px; justify-content: center; }
        .thumb-box img { width: 50px; height: 50px; object-fit: cover; border: 1px solid #333; cursor: pointer; opacity: 0.6; }
        .thumb-box img:hover { opacity: 1; border-color: var(--gold); }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; overflow-y: auto; }
        .modal { position: relative; margin: 30px auto; background: #111; padding: 30px; border: 1px solid var(--gold); width: 95%; max-width: 750px; }
        .checkout-form input, .checkout-form select, .checkout-form textarea { width: 100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid #333; color: white; font-family: inherit; }
        .admin-sec { background:#111; border:1px solid #333; padding:20px; margin-top: 20px; }
        .json-box { background:#000; padding:15px; font-family:monospace; white-space:pre; border:1px solid #333; height:200px; overflow:auto; color: #0f0; margin-top: 10px; font-size: 11px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="openAdmin()">AV</div>
    <nav>
        <span class="nav-link active" onclick="switchTab('summaries.json', this)">SUMMARIES</span>
        <span class="nav-link" onclick="switchTab('books.json', this)">BOOKS</span>
        <span class="nav-link" onclick="switchTab('hoody.json', this)">HOODIES</span>
    </nav>
</header>

<div class="container">
    <div id="display-grid" class="grid"></div>

    <div id="admin-panel" style="display:none; margin-top:50px; border-top: 2px solid var(--gold);">
        <h2 style="color:var(--gold); text-align:center; padding: 20px 0;">VAULT ARCHITECT ADMIN</h2>
        <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom: 20px;">
            <button class="action-btn" onclick="showForm('s')">ADD SUMMARY</button>
            <button class="action-btn" onclick="showForm('b')">ADD BOOK ONLY</button>
            <button class="action-btn" onclick="showForm('p')">ADD HOODIE ONLY</button>
        </div>

        <div id="f-s" class="admin-sec">
            <h4 style="color:var(--gold); margin-bottom:10px;">New Summary Entry</h4>
            <input type="text" id="as-title" placeholder="Title (e.g. The Naval Archive)">
            <textarea id="as-text" placeholder="The Narrative (Summary Text)"></textarea>
            <div class="admin-grid">
                <input type="text" id="as-bimg" placeholder="Book Cover URL">
                <input type="text" id="as-bprice" placeholder="Book Price">
            </div>
            <div class="admin-grid">
                <input type="text" id="as-himg" placeholder="Hoodie Front URL">
                <input type="text" id="as-himg-b" placeholder="Hoodie Back URL">
                <input type="text" id="as-himg-s" placeholder="Hoodie Sleeve Detail URL">
                <input type="text" id="as-fabric" placeholder="Fabric Type (e.g. 100% Cotton)">
            </div>
            <div class="admin-grid">
                <input type="text" id="sh-s" placeholder="Hoodie Price S/M/L">
                <input type="text" id="sh-xl" placeholder="Price XL">
                <input type="text" id="sh-2xl" placeholder="Price 2XL">
                <input type="text" id="sh-3xl" placeholder="Price 3XL">
            </div>
            <button class="action-btn" onclick="generate('s')">GENERATE SUMMARY JSON</button>
        </div>

        <div id="f-b" class="admin-sec" style="display:none;">
            <input type="text" id="ab-title" placeholder="Book Title">
            <input type="text" id="ab-price" placeholder="Price">
            <input type="text" id="ab-img" placeholder="Image URL">
            <input type="text" id="ab-delivery" placeholder="Delivery (e.g. 24h)">
            <button class="action-btn" onclick="generate('b')">GENERATE BOOK</button>
        </div>

        <div id="f-p" class="admin-sec" style="display:none;">
            <input type="text" id="ap-title" placeholder="Product Title">
            <input type="text" id="ap-img-f" placeholder="Front URL">
            <input type="text" id="ap-img-b" placeholder="Back URL">
            <input type="text" id="ap-img-s" placeholder="Sleeve URL">
            <input type="text" id="ap-fabric" placeholder="Fabric Type">
            <input type="text" id="ap-colors" placeholder="Colors">
            <div class="admin-grid">
                <input type="text" id="p-s" placeholder="Price S/M/L">
                <input type="text" id="p-xl" placeholder="Price XL">
                <input type="text" id="p-2xl" placeholder="Price 2XL">
                <input type="text" id="p-3xl" placeholder="Price 3XL">
            </div>
            <button class="action-btn" onclick="generate('p')">GENERATE HOODIE</button>
        </div>

        <div id="out-site" class="json-box"></div>
    </div>
</div>

<div id="action-modal" class="overlay">
    <div class="modal">
        <h2 id="m-title" style="color:var(--gold); text-align:center; margin-bottom:20px; font-family:'Playfair Display'; text-transform:uppercase;"></h2>
        <div id="m-body"></div>
        <button onclick="closeModal()" class="action-btn" style="border:none; color:#666; font-size: 0.7rem;">← BACK TO ARCHIVE</button>
    </div>
</div>

<script>
    (function(){ emailjs.init("QWKaC8MCGOF9GwKvN"); })();
    let currentFile = 'summaries.json';
    let globalPrices = {}; 

    async function switchTab(file, btn) {
        currentFile = file;
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        btn.classList.add('active');
        try {
            const res = await fetch(file);
            const data = await res.json();
            render(data);
        } catch(e) { document.getElementById('display-grid').innerHTML = "<p style='text-align:center; color:#444;'>Archive Empty.</p>"; }
    }

    function render(data) {
        const grid = document.getElementById('display-grid');
        grid.innerHTML = '';
        data.forEach(item => {
            let mediaHtml = item.summaryText ? 
                `<div class="dual-preview">
                    <div><img src="${item.bookImg}"></div>
                    <div><img src="${item.imageUrl}"></div>
                </div>` : 
                `<div class="img-container">
                    <img src="${item.imageUrl || item.bookImg}" onmouseover="this.src='${item.backImageUrl || item.imageUrl || item.bookImg}'" onmouseout="this.src='${item.imageUrl || item.bookImg}'">
                </div>`;

            grid.innerHTML += `
                <div class="card">
                    ${mediaHtml}
                    <h3 style="margin-top:15px; font-size:1.1rem; letter-spacing:1px;">${item.title}</h3>
                    <p style="color:var(--gold); margin:5px 0; font-weight:bold;">$${item.price || item.bookPrice}</p>
                    ${item.delivery ? `<span class="delivery-tag">🚚 ${item.delivery}</span>` : ''}
                    <button class="action-btn" onclick='openAction(${JSON.stringify(item)})'>
                        ${item.summaryText ? 'EXPLORE ARCHIVE' : 'ORDER NOW'}
                    </button>
                </div>`;
        });
    }

    function openAction(item) {
        const modal = document.getElementById('action-modal');
        const body = document.getElementById('m-body');
        document.getElementById('m-title').innerText = item.title;
        modal.style.display = 'block';

        if (item.summaryText) {
            body.innerHTML = `
                <div style="display:flex; gap:20px; flex-wrap:wrap; margin-bottom:20px;">
                    <div style="flex:1; min-width:250px; background:#000; padding:15px; border:1px solid #222;">
                        <img src="${item.bookImg}" style="width:100%; max-height:250px; object-fit:contain; border:1px solid var(--gold); margin-bottom:10px;">
                        <button class="action-btn" onclick="showCheckout('${item.title} (Book)', '${item.bookPrice}', false, '', null, '')">BUY BOOK ($${item.bookPrice})</button>
                    </div>
                    <div style="flex:1; min-width:250px; background:#000; padding:15px; border:1px solid #222;">
                        <img id="view-h" src="${item.imageUrl}" style="width:100%; max-height:250px; object-fit:contain; border:1px solid var(--gold); margin-bottom:10px;">
                        <div class="thumb-box">
                            <img src="${item.imageUrl}" onclick="document.getElementById('view-h').src='${item.imageUrl}'">
                            <img src="${item.backImageUrl}" onclick="document.getElementById('view-h').src='${item.backImageUrl}'">
                            ${item.sleeveImg ? `<img src="${item.sleeveImg}" onclick="document.getElementById('view-h').src='${item.sleeveImg}'" style="border-color:var(--gold); opacity:1;">` : ''}
                        </div>
                        <button class="action-btn" onclick='showCheckout("${item.title} (Hoodie)", "${item.price}", true, "${item.colors || 'Black'}", ${JSON.stringify(item.prices)}, "${item.fabric || 'Premium Cotton'}")'>BUY HOODIE ($${item.price})</button>
                    </div>
                </div>
                <div style="border-top:1px solid #333; padding-top:20px;">
                    <p style="color:#888; text-transform:uppercase; font-size:0.7rem; letter-spacing:2px; margin-bottom:10px; text-align:center;">The Narrative</p>
                    <p style="color:#ccc; line-height:1.6; text-align:justify; font-style: italic;">"${item.summaryText}"</p>
                </div>`;
        } else {
            showCheckout(item.title, item.price || item.bookPrice, currentFile === 'hoody.json', item.colors, item.prices, item.fabric);
        }
    }

    function showCheckout(title, price, isHoodie, colors, prices, fabric) {
        window.currentItemPrice = price;
        globalPrices = prices || { "S": price, "M": price, "L": price, "XL": price, "2XL": price, "3XL": price };
        const body = document.getElementById('m-body');
        let variantHtml = '';

        if(isHoodie) {
            const colorOptions = (colors || "Black").split(',').map(c => `<option>${c.trim()}</option>`).join('');
            variantHtml = `
                <p style="color:#666; font-size:0.8rem; margin-bottom:10px; text-align:center;">Fabric: ${fabric || 'Premium Archive Quality'}</p>
                <select id="f-size" onchange="updatePrice(this)" required>
                    <option value="">CHOOSE SIZE</option>
                    <option value="S">S ($${globalPrices['S']})</option>
                    <option value="M">M ($${globalPrices['M']})</option>
                    <option value="L">L ($${globalPrices['L']})</option>
                    <option value="XL">XL ($${globalPrices['XL']})</option>
                    <option value="2XL">2XL ($${globalPrices['2XL']})</option>
                    <option value="3XL">3XL ($${globalPrices['3XL']})</option>
                </select>
                <select id="f-color" required><option value="">CHOOSE COLOR</option>${colorOptions}</select>`;
        }

        body.innerHTML = `
            <div class="checkout-form">
                <h3 id="checkout-price-tag" style="text-align:center; color:var(--gold); margin-bottom:20px; font-size:1.8rem;">$${price}</h3>
                <input type="text" id="f-name" placeholder="Full Name" required>
                <input type="email" id="f-email" placeholder="Email Address" required>
                ${variantHtml}
                <textarea id="f-addr" placeholder="Shipping Address & Phone Number" rows="3" required></textarea>
                <button class="action-btn" id="s-btn" onclick="sendOrder('${title}')" style="background:var(--gold); color:black; border:none;">CONFIRM RESERVATION</button>
            </div>`;
    }

    function updatePrice(sizeSelect) {
        const val = sizeSelect.value;
        if(val) {
            const newP = globalPrices[val];
            document.getElementById('checkout-price-tag').innerText = "$" + newP;
            window.currentItemPrice = newP;
        }
    }

    function sendOrder(title) {
        const btn = document.getElementById('s-btn');
        const payload = {
            user_name: document.getElementById('f-name').value,
            user_email: document.getElementById('f-email').value,
            user_address: document.getElementById('f-addr').value,
            item_title: title,
            item_price: window.currentItemPrice,
            item_size: document.getElementById('f-size')?.value || 'N/A',
            item_color: document.getElementById('f-color')?.value || 'N/A'
        };
        if(!payload.user_name || !payload.user_email || !payload.user_address) return alert("Archive requires full details.");
        btn.innerText = "ENTERING VAULT..."; btn.disabled = true;
        emailjs.send("service_9yrz8kd", "template_1lgifb3", payload).then(() => {
            alert("Order Archived Successfully."); closeModal();
        }, (err) => { alert("Error: " + err.text); btn.disabled = false; });
    }

    function generate(type) {
        let data = {};
        if(type === 's') {
            const hPrice = document.getElementById('sh-s').value;
            data = { 
                title: document.getElementById('as-title').value, 
                summaryText: document.getElementById('as-text').value, 
                bookImg: document.getElementById('as-bimg').value, 
                bookPrice: document.getElementById('as-bprice').value,
                imageUrl: document.getElementById('as-himg').value,
                backImageUrl: document.getElementById('as-himg-b').value,
                sleeveImg: document.getElementById('as-himg-s').value,
                fabric: document.getElementById('as-fabric').value,
                price: hPrice,
                prices: { "S": hPrice, "M": hPrice, "L": hPrice, "XL": document.getElementById('sh-xl').value, "2XL": document.getElementById('sh-2xl').value, "3XL": document.getElementById('sh-3xl').value }
            };
        } else if(type === 'b') {
            data = { title: document.getElementById('ab-title').value, bookPrice: document.getElementById('ab-price').value, bookImg: document.getElementById('ab-img').value, delivery: document.getElementById('ab-delivery').value };
        } else if(type === 'p') {
            const sPrice = document.getElementById('p-s').value;
            data = { 
                title: document.getElementById('ap-title').value, 
                price: sPrice, 
                imageUrl: document.getElementById('ap-img-f').value, 
                backImageUrl: document.getElementById('ap-img-b').value, 
                sleeveImg: document.getElementById('ap-img-s').value,
                fabric: document.getElementById('ap-fabric').value,
                colors: document.getElementById('ap-colors').value,
                prices: { "S": sPrice, "M": sPrice, "L": sPrice, "XL": document.getElementById('p-xl').value, "2XL": document.getElementById('p-2xl').value, "3XL": document.getElementById('p-3xl').value }
            };
        }
        document.getElementById('out-site').innerText = JSON.stringify(data, null, 2) + ",";
    }

    function showForm(t) { 
        document.getElementById('f-s').style.display = t==='s'?'block':'none'; 
        document.getElementById('f-b').style.display = t==='b'?'block':'none'; 
        document.getElementById('f-p').style.display = t==='p'?'block':'none'; 
    }
    function openAdmin() { if(prompt("Key:") === "canon_-!LB2107") document.getElementById('admin-panel').style.display='block'; }
    function closeModal() { document.getElementById('action-modal').style.display='none'; }
    window.onload = () => switchTab('summaries.json', document.querySelectorAll('.nav-link')[0]);
</script>
</body>
</html>
